services:
  machdraw:
    build: .
    image: machdraw-agent:0.1
    container_name: machdraw-agent
    ports:
      - "${HOST_PORT:-8077}:8077"
    environment:
      # 想接真实模型时取消注释并填 key；不填则用内置的本地抽取模式（无需联网、无需 key）
      # MW_LLM_PROVIDER: deepseek
      # MW_LLM_API_KEY: sk-xxxx
      MW_GATE_TAU: "0.55"
      MW_GATE_TAU_CHUNK: "0.45"
    volumes:
      - ./data-docker:/app/data      # SQLite（账号、错题、学情埋点）持久化
    restart: unless-stopped
