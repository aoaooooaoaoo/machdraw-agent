<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 923 610" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG-CHICUN-SIYAOSU-t FIG-CHICUN-SIYAOSU-d" class="fig-svg">
  <title id="FIG-CHICUN-SIYAOSU-t">尺寸注法四要素：尺寸界线、尺寸线、箭头、尺寸数字</title>
  <desc id="FIG-CHICUN-SIYAOSU-d">左侧为正确注法并用①②③④指出四要素，右侧列出两种常见错误注法。</desc>
  <defs>
  <pattern id="FIG-CHICUN-SIYAOSU__hatch45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-CHICUN-SIYAOSU__hatch135" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-CHICUN-SIYAOSU__hatch45d" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-CHICUN-SIYAOSU__hatch_solid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f2937" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-CHICUN-SIYAOSU__hatch_blue" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#2563eb" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#2563eb" stroke-width="1"/>
  </pattern>
  <pattern id="FIG-CHICUN-SIYAOSU__hatch_orange" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="6" height="6" fill="#ea580c" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#ea580c" stroke-width="1"/>
  </pattern>
  <marker id="FIG-CHICUN-SIYAOSU__ar-ink" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="currentColor"/></marker>
  <marker id="FIG-CHICUN-SIYAOSU__ar-blue" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#2563eb"/></marker>
  <marker id="FIG-CHICUN-SIYAOSU__ar-red" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#dc2626"/></marker>
  <marker id="FIG-CHICUN-SIYAOSU__ar-green" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#16a34a"/></marker>
  <marker id="FIG-CHICUN-SIYAOSU__ar-orange" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#ea580c"/></marker>
  <marker id="FIG-CHICUN-SIYAOSU__ar-amber" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#b45309"/></marker>
  <marker id="FIG-CHICUN-SIYAOSU__ar-violet" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#7c3aed"/></marker>
  <marker id="FIG-CHICUN-SIYAOSU__ar-teal" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#0f766e"/></marker>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="40" y="32" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">图 14  尺寸注法的四要素（正确注法 / 错误注法对照）</text>
    <text x="40" y="52" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">尺寸界线、尺寸线用细实线；箭头画在尺寸线两端；尺寸数字写在尺寸线上方（水平尺寸字头朝上，垂直尺寸字头朝左）。</text>
    <text x="90" y="158" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">正确注法</text>
    <rect x="90" y="200" width="240" height="100" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="90" y1="356" x2="330" y2="356" stroke="currentColor" stroke-width="0.8" marker-start="url(#FIG-CHICUN-SIYAOSU__ar-ink)" marker-end="url(#FIG-CHICUN-SIYAOSU__ar-ink)"/>
    <text x="210" y="351" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor">40</text>
    <line x1="90" y1="303" x2="90" y2="361" stroke="currentColor" stroke-width="0.8"/>
    <line x1="330" y1="303" x2="330" y2="361" stroke="currentColor" stroke-width="0.8"/>
    <line x1="400" y1="200" x2="400" y2="300" stroke="currentColor" stroke-width="0.8" marker-start="url(#FIG-CHICUN-SIYAOSU__ar-ink)" marker-end="url(#FIG-CHICUN-SIYAOSU__ar-ink)"/>
    <text x="405" y="254.2" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">20</text>
    <line x1="333" y1="200" x2="405" y2="200" stroke="currentColor" stroke-width="0.8"/>
    <line x1="333" y1="300" x2="405" y2="300" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="72" cy="330" r="9" stroke="#0f766e" stroke-width="0.8" fill="none"/>
    <text x="72" y="334" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f766e">①</text>
    <circle cx="250" cy="380" r="9" stroke="#0f766e" stroke-width="0.8" fill="none"/>
    <text x="250" y="384" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f766e">②</text>
    <circle cx="348" cy="350" r="9" stroke="#0f766e" stroke-width="0.8" fill="none"/>
    <text x="348" y="354" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f766e">③</text>
    <circle cx="186" cy="336" r="9" stroke="#0f766e" stroke-width="0.8" fill="none"/>
    <text x="186" y="340" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f766e">④</text>
    <text x="600" y="158" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">错误注法（✗）</text>
    <rect x="600" y="200" width="240" height="100" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="600" y1="344" x2="840" y2="344" stroke="currentColor" stroke-width="0.8" marker-start="url(#FIG-CHICUN-SIYAOSU__ar-ink)" marker-end="url(#FIG-CHICUN-SIYAOSU__ar-ink)"/>
    <text x="720" y="348" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor">40</text>
    <text x="852" y="340" font-size="15" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626" font-weight="600">✗</text>
    <text x="600" y="392" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">✗ 尺寸数字被尺寸线穿过 —— 数字处应断开或写在线上方</text>
    <line x1="880" y1="200" x2="880" y2="300" stroke="currentColor" stroke-width="2" marker-start="url(#FIG-CHICUN-SIYAOSU__ar-ink)" marker-end="url(#FIG-CHICUN-SIYAOSU__ar-ink)"/>
    <text x="885" y="254.2" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">20</text>
    <line x1="843" y1="200" x2="885" y2="200" stroke="currentColor" stroke-width="0.8"/>
    <line x1="843" y1="300" x2="885" y2="300" stroke="currentColor" stroke-width="0.8"/>
    <text x="896" y="244" font-size="15" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626" font-weight="600">✗</text>
    <text x="600" y="418" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">✗ 尺寸线画成粗实线 —— 尺寸线、尺寸界线都用细实线</text>
    <text x="40" y="470" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 尺寸界线：由轮廓线、轴线或对称中心线引出，末端超出尺寸线 2～5 mm，用细实线。</text>
    <text x="40" y="494" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 尺寸线：细实线，与被注线段平行，不能用轮廓线、轴线或对称中心线代替。</text>
    <text x="40" y="518" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 箭头：画在尺寸线两端，箭尖接触尺寸界线；位置不够时可画在外侧并用引线引出。</text>
    <text x="40" y="542" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">④ 尺寸数字：写在尺寸线上方居中；水平尺寸字头朝上，垂直尺寸字头朝左，倾斜尺寸按斜线方向注写。</text>
    <text x="40" y="588" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">口诀：界线细、线平行、箭头顶住界线、数字在上不被穿 —— 四条做到，尺寸就合规。</text>
  </g>
</svg>
