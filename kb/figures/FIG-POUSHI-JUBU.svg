  <marker id="FIG-POUSHI-JUBU__ar-green" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#16a34a"/></marker>
  <marker id="FIG-POUSHI-JUBU__ar-orange" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#ea580c"/></marker>
  <marker id="FIG-POUSHI-JUBU__ar-amber" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#b45309"/></marker>
  <marker id="FIG-POUSHI-JUBU__ar-violet" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#7c3aed"/></marker>
  <marker id="FIG-POUSHI-JUBU__ar-teal" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#0f766e"/></marker>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="40" y="32" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">图 7  局部剖视图（平板 120×50，竖直通孔 Ø20）</text>
    <text x="40" y="52" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">局部剖用波浪线作断裂边界 —— 既显示局部内形，又保留大部分外形，不必画成整剖。</text>
    <rect x="360" y="210" width="240" height="100" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="480" y1="194" x2="480" y2="318" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="18 4 3 4"/>
    <path d="M390,210 L386,250 L388,252.38 L390,253.25 L392,251.98 L394,249.32 L396,246.98 L398,246.44 L400,248.01 L402,250.59 L404,252.51 L406,252.55 L408,250.77 L410,248.35 L412,246.79 L414,246.94 L416,248.52 L418,250.42 L420,251.46 L422,251.12 L424,249.76 L426,248.23 L428,247.11 L430,247.1 L432,248.33 L434,250.16 L436,251.48 L438,251.41 L440,249.84 L442,247.56 L444,245.86 L446,245.74 L448,247.3 L450,249.7 L452,251.57 L454,251.83 L456,250.31 L458,247.82 L460,245.71 L460,210 Z" stroke="none" fill="url(#FIG-POUSHI-JUBU__hatch45)"/>
