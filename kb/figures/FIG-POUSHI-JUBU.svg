    <line x1="460" y1="210" x2="460" y2="245.71" stroke="currentColor" stroke-width="2"/>
    <line x1="500" y1="210" x2="500" y2="248.48" stroke="currentColor" stroke-width="2"/>
    <line x1="460" y1="245.71" x2="460" y2="310" stroke="currentColor" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line x1="500" y1="248.48" x2="500" y2="310" stroke="currentColor" stroke-width="0.8" stroke-dasharray="6 4"/>
    <text x="480" y="190" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor" font-weight="600">局部剖视图</text>
    <line x1="560" y1="232" x2="640" y2="214" stroke="#dc2626" stroke-width="0.8" marker-end="url(#FIG-POUSHI-JUBU__ar-red)"/>
    <text x="646" y="218" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">波浪线（细实线，手画，不能与轮廓线重合）</text>
    <line x1="500" y1="290" x2="630" y2="330" stroke="#2563eb" stroke-width="0.8" marker-end="url(#FIG-POUSHI-JUBU__ar-blue)"/>
    <text x="636" y="334" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#2563eb">未剖到的部分照外形画，孔画虚线</text>
    <line x1="360" y1="352" x2="600" y2="352" stroke="currentColor" stroke-width="0.8" marker-start="url(#FIG-POUSHI-JUBU__ar-ink)" marker-end="url(#FIG-POUSHI-JUBU__ar-ink)"/>
    <text x="480" y="347" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor">120</text>
    <line x1="336" y1="210" x2="336" y2="310" stroke="currentColor" stroke-width="0.8" marker-start="url(#FIG-POUSHI-JUBU__ar-ink)" marker-end="url(#FIG-POUSHI-JUBU__ar-ink)"/>
    <text x="331" y="264.2" font-size="12" font-family="system-ui, sans-serif" text-anchor="end" fill="currentColor">50</text>
    <line x1="357" y1="210" x2="331" y2="210" stroke="currentColor" stroke-width="0.8"/>
    <line x1="357" y1="310" x2="331" y2="310" stroke="currentColor" stroke-width="0.8"/>
    <line x1="470" y1="214" x2="300" y2="150" stroke="#6b7280" stroke-width="0.8" marker-end="url(#FIG-POUSHI-JUBU__ar-ink)"/>
    <text x="294" y="154" font-size="11" font-family="system-ui, sans-serif" text-anchor="end" fill="#6b7280">Ø20 通孔</text>
    <text x="40" y="420" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 局部剖：用波浪线作断裂边界，只剖开需要表达内部结构的那一块，其余仍按外形画。</text>
    <text x="40" y="443" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 波浪线必须画在零件的实体部分内，不能与轮廓线重合，不能画在孔、槽的空腔上，也不能是规则的正弦曲线。</text>
    <text x="40" y="466" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 波浪线遇到孔槽时应断开（孔槽处没有实体可以断裂）。</text>
    <text x="40" y="489" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">④ 局部剖一般不加标注，位置由波浪线表达；同一视图上局部剖的数量不宜过多，避免支离破碎。</text>
  </g>
</svg>
