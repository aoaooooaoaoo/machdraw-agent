    <text x="40" y="566" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 定底面：沿 X、Y 方向按 1:1 量出长 60、宽 40，得底面菱形（轴测图里矩形画成平行四边形）。</text>
    <text x="40" y="587" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 竖高度：从底面四个顶点向上引垂线，量高 30。</text>
    <text x="40" y="608" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 完成：连出顶面平行线，只画可见的 9 条棱 —— 被挡住的那个角（后下角）的 3 条棱不画，也不画虚线。</text>
    <text x="40" y="629" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">口诀：轴向尺寸直接量，非轴向尺寸不能量（要按坐标求出两端点再连线）。</text>
