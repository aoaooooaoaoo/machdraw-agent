是新料，剩余反应性最大；平衡循环因为装着多批不同燃耗的燃料，循环初反应性小得多。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第6章 6.1 节 p.98~100、6.2.3 节 p.109 与课件第6章 Slide 31 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">曲线按“突降 + 线性段”模型绘制：寿期初 2.6×10⁴ pcm，平衡循环新料 1.2×10⁴ pcm；卸料燃耗 45（平均）/62（最大）GWd/tU</text></g></svg>
