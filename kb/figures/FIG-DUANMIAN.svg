<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003 587" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG-DUANMIAN-t FIG-DUANMIAN-d" class="fig-svg">
  <title id="FIG-DUANMIAN-t">断面图与剖视图的区别</title>
  <desc id="FIG-DUANMIAN-d">同一零件、同一剖切位置、同一投射方向：断面图只画断面形状，剖视图在断面形状之外还要画出剖切平面后方所有可见轮廓（如底板轮廓）。</desc>
