    <text x="700" y="172" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor" font-weight="600">剖视图</text>
    <text x="700" y="190" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="#6b7280">A—A</text>
    <text x="700" y="440" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor">断面形状 + 剖切面后方可见轮廓</text>
    <text x="700" y="458" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="#6b7280">（底板轮廓可见，但不画剖面线）</text>
    <line x1="800" y1="250" x2="858" y2="220" stroke="#dc2626" stroke-width="0.8" marker-end="url(#FIG-DUANMIAN__ar-red)"/>
    <text x="864" y="224" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">底板轮廓（断面图没有）</text>
    <line x1="350" y1="300" x2="452" y2="336" stroke="#2563eb" stroke-width="0.8" marker-end="url(#FIG-DUANMIAN__ar-blue)"/>
    <text x="458" y="340" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#2563eb">肋板（断面照画剖面线）</text>
    <text x="40" y="496" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 断面图只表达剖切面切断形体后得到的断面形状；剖视图还要把剖切面后方所有可见轮廓都画出来。</text>
    <text x="40" y="519" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 断面图与剖视图的剖面线画法相同（45° 细实线）；但断面图中不会出现剖切面后方的轮廓线。</text>
    <text x="40" y="542" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 移出断面图一般画在视图之外，用剖切符号（粗短画 + 箭头 + 字母）标注；不对称的断面必须标箭头。</text>
    <text x="40" y="565" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">④ 判断口诀：图里出现“后面看得到的轮廓”—— 是剖视图；“只有一个断面”—— 是断面图。</text>
  </g>
</svg>
