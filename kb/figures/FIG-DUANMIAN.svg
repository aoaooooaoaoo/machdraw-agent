    <text x="270" y="232" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor" font-weight="600">断面图</text>
    <text x="270" y="250" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="#6b7280">A—A</text>
    <text x="270" y="392" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor">只画剖切面与形体相交的断面形状</text>
    <text x="270" y="410" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="#6b7280">（肋板：断面照画剖面线）</text>
    <rect x="600" y="200" width="200" height="200" stroke="currentColor" stroke-width="2" fill="none"/>
