7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 3-4  斐克定律、扩散长度与徙动长度 M² = L² + τ</text><text x="40" y="66" font-size="15" fill="#7a8288">中子从浓度高处向低处扩散：J = −D∇φ；热中子先慢化（τ）再扩散（L²），两段路程合成徙动面积 M²</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><text x="40" y="116" font-size="16" font-weight="600" fill="#1f2328">① 斐克定律：净中子流由通量梯度驱动</text><line x1="100" y1="300" x2="440" y2="300" stroke="#1f2328" stroke-width="1.4"/><line x1="100" y1="300" x2="100" y2="146" stroke="#1f2328" stroke-width="1.4"/><line x1="95" y1="300" x2="100" y2="300" stroke="#1f2328" stroke-width="1.2"/><text x="88" y="305" font-size="14" text-anchor="end" fill="#1f2328">0</text><line x1="95" y1="223" x2="100" y2="223" stroke="#1f2328" stroke-width="1.2"/><text x="88" y="228" font-size="14" text-anchor="end" fill="#1f2328">0.5</text><line x1="95" y1="146" x2="100" y2="146" stroke="#1f2328" stroke-width="1.2"/><text x="88" y="151" font-size="14" text-anchor="end" fill="#1f2328">1</text><line x1="100" y1="300" x2="100" y2="305" stroke="#1f2328" stroke-width="1.2"/><text x="100" y="321" font-size="14" text-anchor="middle" fill="#1f2328">0</text><line x1="270" y1="300" x2="270" y2="305" stroke="#1f2328" stroke-width="1.2"/><text x="270" y="321" font-size="14" text-anchor="middle" fill="#1f2328">5</text><line x1="440" y1="300" x2="440" y2="305" stroke="#1f2328" stroke-width="1.2"/><text x="440" y="321" font-size="14" text-anchor="middle" fill="#1f2328">10</text><text x="270" y="340" font-size="15" text-anchor="middle" fill="#1f2328">位置 x</text><text x="58" y="223" font-size="15" text-anchor="middle" fill="#1f2328" transform="rotate(-90 58 223)">φ(x)</text><path d="M100,153.7 L105.8,155.7 L111.5