309" stroke-width="1"/><text x="562" y="284" font-size="13" text-anchor="middle" fill="#b45309">热化点</text><path d="M562,262 L524,292 L584,316 L536,342" stroke="#2f6fb0" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="536" cy="342" r="6" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="536" y="364" font-size="13" text-anchor="middle" fill="#2f6fb0">吸收点</text><line x1="620" y1="158" x2="620" y2="262" stroke="#b45309" stroke-width="1.1" marker-end="url(#FIG-FICK-MIGRATION_ar_orange)" marker-start="url(#FIG-FICK-MIGRATION_ar_orange)"/><text x="628" y="190" font-size="14" font-weight="600" fill="#b45309">慢化段：慢化长度平方 τ</text><text x="628" y="210" font-size="12" fill="#7a8288">快中子裂变→热化的直线距离均方 / 6</text><line x1="620" y1="262" x2="620" y2="342" stroke="#2f6fb0" stroke-width="1.1" marker-end="url(#FIG-FICK-MIGRATION_ar_blue)" marker-start="url(#FIG-FICK-MIGRATION_ar_blue)"/><text x="628" y="296" font-size="14" font-weight="600" fill="#2f6fb0">扩散段：扩散长度平方 L²</text><text x="628" y="316" font-size="12" fill="#7a8288">热中子热化→被吸收的直线距离均方 / 6</text><rect x="506" y="380" width="394" height="74" rx="9" stroke="#1f2328" fill="#ffffff" stroke-width="1.4"/><text x="522" y="404" font-size="17" font-weight="600" fill="#1f2328">M² = L² + τ，  6M² = ⟨r²⟩</text><text x="522" y="428" font-size="14" fill="#7a8288">两段距离叠加，所以徙动长度比任一段都大</text><text x="522" y="446" font-size="14" fill="#c0392b">M² 越大 → 中子越容易泄漏出堆芯</text><text x="40" y="392" font-size="16" font-weight="600" fill="#1f2328">③ 不泄漏概率随几何曲率下降</text><line x1="100" y1="505" x2="450" y2="505" stroke="#1f2328" stroke-width="1.4"/><line x1="100" y1="505" x2="100" y2="412" stroke="#1f2328" stroke-width="1.4"/><line x1="432" y1="505" x2="450" y2="505" stroke="#1f2328" stroke-width="1.4" marker-end="url(#FIG-FICK-MIGRATION_ar_ink)"/><line x1="100" y1="430" x2="100" y2="412" stroke="#1f2328" stroke-width="1.4" marker-end="url(#FIG-FICK-MIGRATION_ar_ink)"/><line x1="95" y1="505" x2="100" y2="505" stroke="#1f2328" stroke-width="1.2"/><text x="88" y="510" font-size="14" text-anchor="end" fill="#1f2328">0</text><line x1="95" y1="458.5" x2="100" y2="458.5" stroke="#1f2328" stroke-width="1.2"/><text x="88" y="463.5" font-size="14" text-anchor="end" fill="#1f2328">0.5</text><line x1="95" y1="412" x2="100" y2="412" stroke="#1f2328" stroke-width="1.2"/><text x="88" y="417" font-size="14" text-anchor="end" fill="#1f2328">1</text><line x1="100" y1="505" x2="100" y2="510" stroke="#1f2328" stroke-width="1.2"/><text x="100" y="526" font-size="14" text-anchor="middle" fill="#1f2328">0</text><line x1="187.5" y1="505" x2="187.5" y2="510" stroke="#1f2328" stroke-width="1.2"/><text x="187.5" y="526" font-size="14" text-anchor="middle" fill="#1f2328">0.002</text><line x1="275" y1="505" x2="275" y2="510" stroke="#1f2328" stroke-width="1.2"/><text x="275" y="526" font-size="14" text-anchor="middle" fill="#1f2328">0.004</text><line x1="362.5" y1="505" x2="362.5" y2="510" stroke="#1f2328" stroke-width="1.2"/><text x="362.5" y="526" font-size="14" text-anchor="middle" fill="#1f2328">0.006</text><line x1="450" y1="505" x2="450" y2="510" stroke="#1f2328" stroke-width="1.2"/><text x="450" y="526" font-size="14" text-anchor="middle" fill="#1f2328">0.008</text><text x="275" y="547" font-size="15" text-anchor="middle" fill="#1f2328">几何曲率 B² / cm⁻²</text><text x="58" y="458.5" font-size="15" text-anchor="middle" fill="#1f2328" transform="rotate(-90 58 458.5)">P_NL</text><path d="M100,412 L102.9,412.2 L105.9,412.4 L108.8,412.7 L111.8,412.9 L114.7,413.1 L117.6,413.3 L120.6,413.5 L123.5,413.7 L126.5,413.9 L129.4,414.1 L132.4,414.3 L135.3,414.6 L138.2,414.8 L141.2,415 L144.1,415.2 L147.1,415.4 L150,415.6 L152.9,415.8 L155.9,416 L158.8,416.2 L161.8,416.4 L164.7,416.6 L167.6,416.8 L170.6,417 L173.5,417.2 L176.5,417.4 L179.4,417.6 L182.4,417.7 L185.3,417.9 L188.2,418.1 L191.2,418.3 L194.1,418.5 L197.1,418.7 L200,418.9 L202.9,419.1 L205.9,419.3 L208.8,419.4 L211.8,419.6 L214.7,419.8 L217.6,420 L220.