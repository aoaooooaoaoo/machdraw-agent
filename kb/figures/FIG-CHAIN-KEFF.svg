<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-CHAIN-KEFF-t FIG-CHAIN-KEFF-d"><title id="FIG-CHAIN-KEFF-t">图 3-1  自持链式裂变反应与有效增殖因数 k_eff</title><desc id="FIG-CHAIN-KEFF-d">k_eff = 下一代中子数 / 上一代中子数 = 产生率 /（吸收率 + 泄漏率）；k&gt;1 超临界、k=1 临界、k&lt;1 次临界</desc><defs><marker id="FIG-CHAIN-KEFF_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-CHAIN-KEFF_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-CHAIN-KEFF_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-CHAIN-KEFF_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-CHAIN-KEFF_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-CHAIN-KEFF_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-CHAIN-KEFF_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-CHAIN-KEFF_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-CHAIN-KEFF_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 3-1  自持链式裂变反应与有效增殖因数 k_eff</text><text x="40" y="66" font-size="15" fill="#7a8288">k_eff = 下一代中子数 / 上一代中子数 = 产生率 /（吸收率 + 泄漏率）；k&gt;1 超临界、k=1 临界、k&lt;1 次临界</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><text x="40" y="116" font-size="16" font-weight="600" fill="#1f2328">链式反应：一代中子引发下一代裂变</text><text x="102" y="150" font-size="13" text-anchor="middle" fill="#7a8288">第 1 代</text><text x="232" y="150" font-size="13" text-anchor="middle" fill="#7a8288">第 2 代</text><text x="362" y="150" font-size="13" text-anchor="middle" fill="#7a8288">第 3 代</text><circle cx="102" cy="236" r="15" stroke="#c0392b" fill="#c0392b" stroke-width="1.2" opacity="0.85"/><text x="102" y="241" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">f</text><line x1="118" y1="236" x2="210" y2="176" stroke="#7a8288" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#FIG-CHAIN-KEFF_ar_aux)"/><line x1="118" y1="236" x2="210" y2="236" stroke="#2f6fb0" stroke-width="1.6" marker-end="url(#FIG-CHAIN-KEFF_ar_blue)"/><line x1="118" y1="236" x2="210" y2="296" stroke="#7a8288" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#FIG-CHAIN-KEFF_ar_aux)"/><circle cx="232" cy="176" r="12" stroke="#7a8288" fill="#ffffff" stroke-width="1.3"/><text x="232" y="172" font-size="13" fill="#7a8288">泄漏出堆外</text><circle cx="232" cy="236" r="12" stroke="#7a8288" fill="#ffffff" stroke-width="1.3"/><text x="232" y="254" font-size="13" fill="#7a8288">被结构材料吸收</text><circle cx="232" cy="296" r="12" stroke="#2f6fb0" fill="#e8f0fa" stroke-width="1.4"/><text x="232" y="314" font-size="13" fill="#2f6fb0">引发下一次裂变</text><line x1="254" y1="296" x2="340" y2="296" stroke="#2f6fb0" stroke-width="1.6" marker-end="url(#FIG-CHAIN-KEFF_ar_blue)"/><circle cx="362" cy="296" r="15" stroke="#c0392b" fill="#c0392b" stroke-width="1.2" opacity="0.85"/><text x="362" y="301" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">f</text><line x1="362" y1="281" x2="362" y2="246" stroke="#c0392b" stroke-width="1.4" marker-end="url(#FIG-CHAIN-KEFF_ar_red)"/><text x="392" y="250" font-size="13" fill="#c0392b">ν 个新中子</text><text x="40" y="352" font-size="14" fill="#7a8288">一个裂变放出 ν 个快中子（²³⁵U 热裂变 ν≈2.44），只有不泄漏、不被非燃料吸收的那部分</text><text x="40" y="372" font-size="14" fill="#7a8288">才能引发新的裂变——比例就是 k_eff。</text><rect x="430" y="104" width="490" height="148" rx="10" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.4"/><text x="448" y="130" font-size="15" font-weight="600" fill="#2f6fb0">定义</text><text x="448" y="160" font-size="17" font-weight="600" fill="#1f2328">k_eff = 下一代中子数 ÷ 上一代中子数</text><text x="448" y="190" font-size="16" fill="#1f2328">     = νΣ_f Φ V ÷（Σ_a Φ V + D B² Φ V）</text><text x="448" y="216" font-size="15" fill="#7a8288">     = 产生率 ÷（吸收率 + 泄漏率）</text><text x="448" y="240" font-size="15" font-weight="600" fill="#c0392b">反应性 ρ = (k_eff − 1)/k_eff，1 pcm = 10⁻⁵</text><text x="430" y="282" font-size="16" font-weight="600" fill="#1f2328">三种状态</text><rect x="430" y="296" width="156" height="130" rx="8" stroke="#2e7d4f" fill="#ffffff" stroke-width="1.3"/><text x="508" y="318" font-size="15" text-anchor="middle" font-weight="600" fill="#2e7d4f">超临界 k&gt;1</text><text x="508" y="338" font-size="13" text-anchor="middle" fill="#1f2328">ρ&gt;0：功率按指数上升</text><path d="M456,400.7 L458.7,400.4 L461.3,400 L464,399.7 L466.7,399.3 L469.3,398.8 L472,398.4 L474.7,397.9 L477.3,397.4 L480,396.8 L482.7,396.3 L485.3,395.6 L488,395 L490.7,394.3 L493.3,393.5 L496,392.8 L498.7,391.9 L501.3,391 L504,390.1 L506.7,389.1 L509.3,388 L512,386.8 L514.7,385.6 L517.3,384.3 L520,383 L522.7,381.5 L525.3,379.9 L528,378.3 L530.7,376.5 L533.3,374.7 L536,372.7 L538.7,370.5 L541.3,368.3 L544,365.9 L546.7,363.4 L549.3,360.7 L552,357.8 L554.7,354.7 L557.3,351.5 L560,348" stroke="#2e7d4f" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="456" y1="406" x2="560" y2="406" stroke="#7a8288" stroke-width="0.9" marker-end="url(#FIG-CHAIN-KEFF_ar_aux)"/><line x1="456" y1="406" x2="456" y2="348" stroke="#7a8288" stroke-width="0.9" marker-end="url(#FIG-CHAIN-KEFF_ar_aux)"/><text x="560" y="422" font-size="12" fill="#7a8288">t</text><text x="448" y="352" font-size="12" text-anchor="end" fill="#7a8288">n</text><rect x="600" y="296" width="156" height="130" rx="8" stroke="#2f6fb0" fill="#ffffff" stroke-width="1.3"/><text x="678" y="318" font-size="15" text-anchor="middle" font-weight="600" fill="#2f6fb0">临界 k=1</text><text x="678" y="338" font-size="13" text-anchor="middle" fill="#1f2328">ρ=0：功率稳定（自持）</text><path d="M626,348 L628.7,348 L631.3,348 L634,348 L636.7,348 L639.3,348 L642,348 L644.7,348 L647.3,348 L650,348 L652.7,348 L655.3,348 L658,348 L660.7,348 L663.3,348 L666,348 L668.7,348 L671.3,348 L674,348 L676.7,348 L679.3,348 L682,348 L684.7,348 L687.3,348 L690,348 L692.7,348 L695.3,348 L698,348 L700.7,348 L703.3,348 L706,348 L708.7,348 L711.3,348 L714,348 L716.7,348 L719.3,348 L722,348 L724.7,348 L727.3,348 L730,348" stroke="#2f6fb0" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="626" y1="406" x2="730" y2="406" stroke="#7a8288" stroke-width="0.9" marker-end="url(#FIG-CHAIN-KEFF_ar_aux)"/><line x1="626" y1="406" x2="626" y2="348" stroke="#7a8288" stroke-width="0.9" marker-end="url(#FIG-CHAIN-KEFF_ar_aux)"/><text x="730" y="422" font-size="12" fill="#7a8288">t</text><text x="618" y="352" font-size="12" text-anchor="end" fill="#7a8288">n</text><rect x="770" y="296" width="156" height="130" rx="8" stroke="#c0392b" fill="#ffffff" stroke-width="1.3"/><text x="848" y="318" font-size="15" text-anchor="middle" font-weight="600" fill="#c0392b">次临界 k&lt;1</text><text x="848" y="338" font-size="13" text-anchor="middle" fill="#1f2328">ρ&lt;0：功率逐渐衰减</text><path d="M796,348 L798.7,351.5 L801.3,354.7 L804,357.8 L806.7,360.7 L809.3,363.4 L812,365.9 L814.7,368.3 L817.3,370.5 L820,372.7 L822.7,374.7 L825.3,376.5 L828,378.3 L830.7,379.9 L833.3,381.5 L836,383 L838.7,384.3 L841.3,385.6 L844,386.8 L846.7,388 L849.3,389.1 L852,390.1 L854.7,391 L857.3,391.9 L860,392.8 L862.7,393.5 L865.3,394.3 L868,395 L870.7,395.6 L873.3,396.3 L876,396.8 L878.7,397.4 L881.3,397.9 L884,398.4 L886.7,398.8 L889.3,399.3 L892,399.7 L894.7,400 L897.3,400.4 L900,400.7" stroke="#c0392b" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="796" y1="406" x2="900" y2="406" stroke="#7a8288" stroke-width="0.9" marker-end="url(#FIG-CHAIN-KEFF_ar_aux)"/><line x1="796" y1="406" x2="796" y2="348" stroke="#7a8288" stroke-width="0.9" marker-end="url(#FIG-CHAIN-KEFF_ar_aux)"/><text x="900" y="422" font-size="12" fill="#7a8288">t</text><text x="788" y="352" font-size="12" text-anchor="end" fill="#7a8288">n</text><rect x="40" y="392" width="360" height="156" rx="8" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><text x="58" y="416" font-size="15" font-weight="600" fill="#1f2328">反应性的三种常用单位</text><text x="58" y="442" font-size="14" fill="#1f2328">· Δk/k：无量纲，常用 %</text><text x="58" y="466" font-size="14" fill="#1f2328">· pcm：1 pcm = 10⁻⁵ Δk/k</text><text x="58" y="490" font-size="14" fill="#1f2328">· $（元）：ρ/β，压水堆 1$ ≈ 650 pcm</text><text x="58" y="524" font-size="14" fill="#c0392b">例：k 由 1.000 变到 1.005</text><text x="58" y="544" font-size="14" fill="#c0392b">ρ = 0.005/1.005 ≈ 4975 pcm</text><text x="40" y="574" font-size="14" fill="#7a8288">k_eff 越接近 1，功率对反应性越敏感——这也是“反应性”比“k”更适合描述偏离临界程度的原因。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第3章 3.1.1 节 p.29~31 自绘</text></g></svg>
