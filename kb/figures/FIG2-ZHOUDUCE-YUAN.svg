    <text x="850" y="148" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor">长轴 ≈ 1.22d（蓝）、短轴 ≈ 0.71d（红）</text>
    <text x="40" y="536" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 四心圆法是近似画法：四个圆心取在短对角线两端与长对角线上，四段弧在菱形各边中点相接。</text>
    <text x="40" y="557" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 长轴近似 1.22d、短轴 0.71d（d 为圆的直径）；实际作图用四心法即可，不必量轴长。</text>
    <text x="40" y="578" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 三个坐标面上的圆，椭圆长轴方向不同 —— 长轴始终垂直于该面法线的轴测投影方向。</text>
  </g>
</svg>
