<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 959 662" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG-GONGCHA-DAI-t FIG-GONGCHA-DAI-d" class="fig-svg">
  <title id="FIG-GONGCHA-DAI-t">公差带图：Φ30 H7/k6</title>
  <desc id="FIG-GONGCHA-DAI-d">零线、孔 H7 公差带（0～+21 μm）、轴 k6 公差带（+2～+15 μm），标出 ES/EI/es/ei 与最大间隙、最大过盈。</desc>
  <defs>
  <pattern id="FIG-GONGCHA-DAI__hatch45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-GONGCHA-DAI__hatch135" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-GONGCHA-DAI__hatch45d" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-GONGCHA-DAI__hatch_solid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f2937" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-GONGCHA-DAI__hatch_blue" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#2563eb" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#2563eb" stroke-width="1"/>
  </pattern>
  <pattern id="FIG-GONGCHA-DAI__hatch_orange" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="6" height="6" fill="#ea580c" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#ea580c" stroke-width="1"/>
  </pattern>
  <marker id="FIG-GONGCHA-DAI__ar-ink" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="currentColor"/></marker>
  <marker id="FIG-GONGCHA-DAI__ar-blue" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#2563eb"/></marker>
  <marker id="FIG-GONGCHA-DAI__ar-red" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#dc2626"/></marker>
  <marker id="FIG-GONGCHA-DAI__ar-green" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#16a34a"/></marker>
  <marker id="FIG-GONGCHA-DAI__ar-orange" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#ea580c"/></marker>
  <marker id="FIG-GONGCHA-DAI__ar-amber" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#b45309"/></marker>
  <marker id="FIG-GONGCHA-DAI__ar-violet" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#7c3aed"/></marker>
  <marker id="FIG-GONGCHA-DAI__ar-teal" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#0f766e"/></marker>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="40" y="32" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">图 10  公差带图（Φ30 H7/k6，单位 μm）</text>
    <text x="40" y="52" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">孔 H7：EI = 0、ES = +0.021；轴 k6：ei = +0.002、es = +0.015 —— 数值取自 GB/T 1800.1。</text>
    <line x1="112" y1="430" x2="900" y2="430" stroke="currentColor" stroke-width="1.4"/>
    <line x1="112" y1="500" x2="112" y2="286" stroke="currentColor" stroke-width="0.8"/>
    <line x1="106" y1="430" x2="118" y2="430" stroke="currentColor" stroke-width="0.8"/>
    <text x="100" y="434" font-size="11" font-family="system-ui, sans-serif" text-anchor="end" fill="currentColor">0</text>
    <line x1="106" y1="370" x2="118" y2="370" stroke="currentColor" stroke-width="0.8"/>
    <text x="100" y="374" font-size="11" font-family="system-ui, sans-serif" text-anchor="end" fill="currentColor">+10</text>
    <line x1="106" y1="310" x2="118" y2="310" stroke="currentColor" stroke-width="0.8"/>
    <text x="100" y="314" font-size="11" font-family="system-ui, sans-serif" text-anchor="end" fill="currentColor">+20</text>
    <text x="112" y="276" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor">偏差 / μm</text>
    <text x="906" y="434" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">零线 0</text>
    <rect x="210" y="304" width="160" height="126" stroke="#2563eb" stroke-width="2" fill="#2563eb" fill-opacity="0.14"/>
    <rect x="430" y="340" width="160" height="78" stroke="#ea580c" stroke-width="2" fill="#ea580c" fill-opacity="0.14"/>
    <text x="210" y="296" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#2563eb">ES = +0.021</text>
    <text x="210" y="448" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#2563eb">EI = 0</text>
    <text x="440" y="358" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#ea580c">es = +0.015</text>
    <text x="440" y="410" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#ea580c">ei = +0.002</text>
    <text x="290" y="472" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="#2563eb" font-weight="600">孔 Φ30 H7</text>
    <text x="510" y="472" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="#ea580c" font-weight="600">轴 Φ30 k6</text>
    <line x1="370" y1="304" x2="650" y2="304" stroke="#0f766e" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line x1="590" y1="418" x2="650" y2="418" stroke="#0f766e" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line x1="650" y1="304" x2="650" y2="418" stroke="#0f766e" stroke-width="0.8" marker-start="url(#FIG-GONGCHA-DAI__ar-teal)" marker-end="url(#FIG-GONGCHA-DAI__ar-teal)"/>
    <text x="662" y="356" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#0f766e" font-weight="600">Xmax</text>
    <text x="662" y="374" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#0f766e">= +19 μm</text>
    <line x1="590" y1="340" x2="790" y2="340" stroke="#7c3aed" stroke-width="0.8" stroke-dasharray="6 4"/>
    <line x1="790" y1="340" x2="790" y2="430" stroke="#7c3aed" stroke-width="0.8" marker-start="url(#FIG-GONGCHA-DAI__ar-violet)" marker-end="url(#FIG-GONGCHA-DAI__ar-violet)"/>
    <text x="802" y="356" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#7c3aed" font-weight="600">Ymax</text>
    <text x="802" y="374" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#7c3aed">= 15 μm</text>
    <text x="210" y="512" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#2563eb">孔公差带完全在零线上方（基孔制 H：EI = 0）</text>
    <text x="210" y="534" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#ea580c">轴 k6 的公差带（+2～+15）也全部在零线上方 → 过渡配合</text>
    <text x="40" y="560" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 零线是基本尺寸对应的偏差为零的直线；零线以上为正偏差，以下为负偏差，单位一律 μm。</text>
    <text x="40" y="580" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② ES / EI 是孔的上、下偏差；es / ei 是轴的上、下偏差（大写对孔、小写对轴）。</text>
    <text x="40" y="600" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 配合性质看两带的位置关系：孔带全在轴带之上为间隙配合；两带有重叠为过渡配合；孔带全在轴带之下为过盈配合。</text>
    <text x="40" y="620" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">④ 本例 Xmax = ES − ei = +19 μm（最大间隙），Ymax = es − EI = +15 μm（最大过盈）→ 过渡配合。</text>
    <text x="40" y="640" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">⑤ 注意：k6 的 ei = +2 μm，轴公差带整体在零线上方，它并不跨零线；真正跨零线的是 js / j / J 这类对称偏差代号。</text>
  </g>
</svg>
