832" y="367.7" font-size="12" fill="#1f2328">2000</text><line x1="820" y1="295.4" x2="826" y2="295.4" stroke="#1f2328" stroke-width="1.1"/><text x="832" y="300.4" font-size="12" fill="#1f2328">4000</text><line x1="820" y1="211.3" x2="826" y2="211.3" stroke="#1f2328" stroke-width="1.1"/><text x="832" y="216.3" font-size="12" fill="#1f2328">6500</text><text x="886" y="287" font-size="14" text-anchor="middle" fill="#1f2328" transform="rotate(-90 886 287)">反应性 / pcm</text><rect x="40" y="452" width="880" height="96" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.2"/><text x="56" y="476" font-size="15" font-weight="600" fill="#2f6fb0">怎么用这张图（周期法测反应性）</text><text x="56" y="500" font-size="14" fill="#1f2328">① 提升控制棒或调硼使堆芯略微超临界，等功率按纯指数上升（各快根衰减完）；</text><text x="56" y="522" font-size="14" fill="#1f2328">② 由功率曲线量出稳定周期 T（功率涨 e 倍所需时间），再查本曲线得到 ρ——这就是启动试验里的“周期法”。</text><text x="40" y="570" font-size="14" fill="#7a8288">结论：短周期对应大反应性；T 从 100 s 缩到 10 s，ρ 要涨约 5 倍——所以周期是反应性最灵敏的“仪表”。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第8章 8.2 节 p.129~132 与课件第8章 Slide 19 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">ρ = Λ/T + Σ β_i/(1+λ_i T)；取 β=0.006502、Λ=1.0×10⁻⁴ s</text></g></svg>
