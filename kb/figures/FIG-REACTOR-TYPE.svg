<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-REACTOR-TYPE-t FIG-REACTOR-TYPE-d"><title id="FIG-REACTOR-TYPE-t">图 1-2  核反应堆的分类与常见堆型</title><desc id="FIG-REACTOR-TYPE-d">分类的四个维度互相独立：同一座堆可以同时是“热中子堆 + 动力堆 + 压水堆 + 商用堆”</desc><defs><marker id="FIG-REACTOR-TYPE_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-REACTOR-TYPE_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-REACTOR-TYPE_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-REACTOR-TYPE_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-REACTOR-TYPE_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-REACTOR-TYPE_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-REACTOR-TYPE_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-REACTOR-TYPE_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-REACTOR-TYPE_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 1-2  核反应堆的分类与常见堆型</text><text x="40" y="66" font-size="15" fill="#7a8288">分类的四个维度互相独立：同一座堆可以同时是“热中子堆 + 动力堆 + 压水堆 + 商用堆”</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><rect x="40" y="104" width="95" height="25" rx="5" stroke="#1f2328" fill="#f0eee8" stroke-width="1.1"/><text x="87.5" y="121" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">按反应原理</text><rect x="40" y="146" width="420" height="44" rx="6" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><circle cx="54" cy="168" r="4" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="68" y="167" font-size="15" font-weight="600" fill="#2f6fb0">裂变堆</text><text x="68" y="184" font-size="13" fill="#7a8288">重核裂变，目前商用主流</text><rect x="40" y="198" width="420" height="44" rx="6" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><circle cx="54" cy="220" r="4" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="68" y="219" font-size="15" font-weight="600" fill="#2f6fb0">聚变堆</text><text x="68" y="236" font-size="13" fill="#7a8288">轻核聚合，尚在实验</text><rect x="500" y="104" width="95" height="25" rx="5" stroke="#1f2328" fill="#f0eee8" stroke-width="1.1"/><text x="547.5" y="121" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">按中子能谱</text><rect x="500" y="146" width="420" height="44" rx="6" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><circle cx="514" cy="168" r="4" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="528" y="167" font-size="15" font-weight="600" fill="#2f6fb0">热中子堆</text><text x="528" y="184" font-size="13" fill="#7a8288">En ≤ 1 eV 占主导</text><rect x="500" y="198" width="420" height="44" rx="6" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><circle cx="514" cy="220" r="4" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="528" y="219" font-size="15" font-weight="600" fill="#2f6fb0">快中子堆</text><text x="528" y="236" font-size="13" fill="#7a8288">无慢化剂，En&gt;0.1 MeV</text><rect x="40" y="258" width="65" height="25" rx="5" stroke="#1f2328" fill="#f0eee8" stroke-width="1.1"/><text x="72.5" y="275" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">按功能</text><rect x="40" y="300" width="420" height="44" rx="6" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><circle cx="54" cy="322" r="4" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="68" y="321" font-size="15" font-weight="600" fill="#2f6fb0">动力堆 / 生产堆</text><text x="68" y="338" font-size="13" fill="#7a8288">发电供热；生产 Pu 与同位素</text><rect x="40" y="352" width="420" height="44" rx="6" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><circle cx="54" cy="374" r="4" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="68" y="373" font-size="15" font-weight="600" fill="#2f6fb0">研究堆</text><text x="68" y="390" font-size="13" fill="#7a8288">实验研究与中子源</text><rect x="500" y="258" width="95" height="25" rx="5" stroke="#1f2328" fill="#f0eee8" stroke-width="1.1"/><text x="547.5" y="275" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">按发展阶段</text><rect x="500" y="300" width="420" height="44" rx="6" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><circle cx="514" cy="322" r="4" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="528" y="321" font-size="15" font-weight="600" fill="#2f6fb0">实验堆 / 原型堆</text><text x="528" y="338" font-size="13" fill="#7a8288">验证原理与工程可行性</text><rect x="500" y="352" width="420" height="44" rx="6" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><circle cx="514" cy="374" r="4" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="528" y="373" font-size="15" font-weight="600" fill="#2f6fb0">商用堆</text><text x="528" y="390" font-size="13" fill="#7a8288">批量建造、商业运行</text><text x="40" y="424" font-size="16" font-weight="600" fill="#1f2328">常见堆型（慢化剂 / 冷却剂 / 中子能谱）</text><rect x="40" y="436" width="168" height="118" rx="8" stroke="#2f6fb0" fill="#ffffff" stroke-width="1.6"/><rect x="40" y="436" width="168" height="28" rx="6" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1.2"/><text x="124" y="456" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">压水堆 PWR</text><text x="50" y="486" font-size="13" fill="#1f2328">慢化剂：轻水 / 轻水</text><text x="50" y="506" font-size="13" fill="#1f2328">能谱：热谱</text><text x="50" y="526" font-size="13" fill="#7a8288">商用主流：一回路高压不</text><text x="50" y="544" font-size="13" fill="#7a8288">沸腾</text><rect x="216" y="436" width="168" height="118" rx="8" stroke="#0f766e" fill="#ffffff" stroke-width="1.6"/><rect x="216" y="436" width="168" height="28" rx="6" stroke="#0f766e" fill="#0f766e" stroke-width="1.2"/><text x="300" y="456" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">沸水堆 BWR</text><text x="226" y="486" font-size="13" fill="#1f2328">慢化剂：轻水 / 轻水</text><text x="226" y="506" font-size="13" fill="#1f2328">能谱：热谱</text><text x="226" y="526" font-size="13" fill="#7a8288">一回路直接沸腾，蒸汽去</text><text x="226" y="544" font-size="13" fill="#7a8288">汽轮机</text><rect x="392" y="436" width="168" height="118" rx="8" stroke="#2e7d4f" fill="#ffffff" stroke-width="1.6"/><rect x="392" y="436" width="168" height="28" rx="6" stroke="#2e7d4f" fill="#2e7d4f" stroke-width="1.2"/><text x="476" y="456" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">重水堆 CANDU</text><text x="402" y="486" font-size="13" fill="#1f2328">慢化剂：重水 / 重水</text><text x="402" y="506" font-size="13" fill="#1f2328">能谱：热谱</text><text x="402" y="526" font-size="13" fill="#7a8288">可用天然铀，燃耗在线更</text><text x="402" y="544" font-size="13" fill="#7a8288">换</text><rect x="568" y="436" width="168" height="118" rx="8" stroke="#b45309" fill="#ffffff" stroke-width="1.6"/><rect x="568" y="436" width="168" height="28" rx="6" stroke="#b45309" fill="#b45309" stroke-width="1.2"/><text x="652" y="456" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">高温气冷堆 HTGR</text><text x="578" y="486" font-size="13" fill="#1f2328">慢化剂：石墨 / 氦气</text><text x="578" y="506" font-size="13" fill="#1f2328">能谱：热谱</text><text x="578" y="526" font-size="13" fill="#7a8288">出口温度高，固有安全性</text><text x="578" y="544" font-size="13" fill="#7a8288">好</text><rect x="744" y="436" width="168" height="118" rx="8" stroke="#5b4b8a" fill="#ffffff" stroke-width="1.6"/><rect x="744" y="436" width="168" height="28" rx="6" stroke="#5b4b8a" fill="#5b4b8a" stroke-width="1.2"/><text x="828" y="456" font-size="14" text-anchor="middle" font-weight="600" fill="#ffffff">快中子堆 FR</text><text x="754" y="486" font-size="13" fill="#1f2328">慢化剂：无 / 液钠</text><text x="754" y="506" font-size="13" fill="#1f2328">能谱：快谱</text><text x="754" y="526" font-size="13" fill="#7a8288">增殖比可 &gt;1，嬗变 </text><text x="754" y="544" font-size="13" fill="#7a8288">MA</text><text x="40" y="570" font-size="14" fill="#7a8288">热中子堆必须带慢化剂；快中子堆不带慢化剂，靠高能中子维持链式反应。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第1章 1.1 节 p.5 与课件第1章自绘</text></g></svg>
