305" stroke="#1f2328" stroke-width="1.2"/><text x="723" y="321" font-size="14" text-anchor="middle" fill="#1f2328">0.5</text><line x1="806.5" y1="300" x2="806.5" y2="305" stroke="#1f2328" stroke-width="1.2"/><text x="806.5" y="321" font-size="14" text-anchor="middle" fill="#1f2328">0.75</text><line x1="890" y1="300" x2="890" y2="305" stroke="#1f2328" stroke-width="1.2"/><text x="890" y="321" font-size="14" text-anchor="middle" fill="#1f2328">1</text><text x="723" y="338" font-size="15" text-anchor="middle" fill="#1f2328">r / R′</text><text x="512" y="220" font-size="15" text-anchor="middle" fill="#1f2328" transform="rotate(-90 512 220)">φ(r)/φ_max</text><path d="M556,154.5 L557.7,154.6 L559.4,154.6 L561,154.6 L562.7,154.6 L564.4,154.7 L566.1,154.7 L567.7,154.8 L569.4,154.9 L571.1,155 L572.8,155.1 L574.5,155.2 L576.1,155.3 L577.8,155.4 L579.5,155.6 L581.2,155.7 L582.9,155.9 L584.5,156.1 L586.2,156.3 L587.9,156.5 L589.6,156.7 L591.2,156.9 L592.9,157.1 L594.6,157.3 L596.3,157.6 L598,157.8 L599.6,158.1 L601.3,158.4 L603,158.7 L604.7,159 L606.4,159.3 L608,159.6 L609.7,159.9 L611.4,160.3 L613.1,160.6 L614.7,161 L616.4,161.3 L618.1,161.7 L619.8,162.1 L621.5,162.5 L623.1,162.9 L624.8,163.3 L626.5,163.8 L628.2,164.2 L629.8,164.6 L631.5,165.1 L633.2,165.6 L634.9,166 L636.6,166.5 L638.2,167 L639.9,167.5 L641.6,168 L643.3,168.6 L645,169.1 L646.6,169.6 L648.3,170.2 L650,170.7 L651.7,171.3 L653.3,171.9 L655,172.5 L656.7,173 L658.4,173.6 L660.1,174.3 L661.7,174.9 L663.4,175.5 L665.1,176.1 L666.8,176.8 L668.5,177.4 L670.1,178.1 L671.8,178.8 L673.5,179.4 L675.2,180.1 L676.8,180.8 L678.5,181.5 L680.2,182.2 L681.9,182.9 L683.6,183.6 L685.2,184.4 L686.9,185.1 L688.6,185.9 L690.3,186.6 L691.9,187.4 L693.6,188.1 L695.3,188.9 L697,189.7 L698.7,190.5 L700.3,191.3 L702,192.1 L703.7,192.9 L705.4,193.7 L707.1,194.5 L708.7,195.3 L710.4,196.1 L712.1,197 L713.8,197.8 L715.4,198.7 L717.1,199.5 L718.8,200.4 L720.5,201.3 L722.2,202.1 L723.8,203 L725.5,203.9 L727.2,204.8 L728.9,205.7 L730.6,206.6 L732.2,207.5 L733.9,208.4 L735.6,209.3 L737.3,210.2 L738.9,211.1 L740.6,212.1 L742.3,213 L744,213.9 L745.7,214.9 L747.3,215.8 L749,216.7 L750.7,217.7 L752.4,218.7 L754.1,219.6 L755.7,220.6 L757.4,221.5 L759.1,222.5 L760.8,223.5 L762.4,224.5 L764.1,225.4 L765.8,226.4 L767.5,227.4 L769.2,228.4 L770.8,229.4 L772.5,230.4 L774.2,231.4 L775.9,232.4 L777.5,233.4 L779.2,234.4 L780.9,235.4 L782.6,236.4 L784.3,237.4 L785.9,238.4 L787.6,239.4 L789.3,240.4 L791,241.4 L792.7,242.5 L794.3,243.5 L796,244.5 L797.7,245.5 L799.4,246.5 L801,247.5 L802.7,248.6 L804.4,249.6 L806.1,250.6 L807.8,251.6 L809.4,252.7 L811.1,253.7 L812.8,254.7 L814.5,255.7 L816.2,256.7 L817.8,257.8 L819.5,258.8 L821.2,259.8 L822.9,260.8 L824.5,261.9 L826.2,262.9 L827.9,263.9 L829.6,264.9 L831.3,265.9 L832.9,266.9 L834.6,268 L836.3,269 L838,270 L839.6,271 L841.3,272 L843,273 L844.7,274 L846.4,275 L848,276 L849.7,277 L851.4,278 L853.1,279 L854.8,280 L856.4,281 L858.1,281.9 L859.8,282.9 L861.5,283.9 L863.1,284.9 L864.8,285.9 L866.5,286.8 L868.2,287.8 L869.9,288.8 L871.5,289.7 L873.2,290.7 L874.9,291.6 L876.6,292.6 L878.3,293.5 L879.9,294.5 L881.6,295.4 L883.3,296.3 L885,297.3 L886.6,298.2 L888.3,299.1 L890,300" stroke="#0f766e" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="556" y1="237.2" x2="890" y2="237.2" stroke="#c0392b" stroke-width="1" stroke-dasharray="6 4"/><text x="572.7" y="255.2" font-size="12" fill="#c0392b">平均值 ≈ 0.43 φ_max</text><rect x="700" y="152" width="180" height="44" rx="5" stroke="#e3e0da" fill="#ffffff" stroke-width="1"/><text x="710" y="170" font-size="13" font-weight="600" fill="#1f2328">F_r = 1/0.432 ≈ 2.32</text><text x="710" y="188" font-size="11" fill="#7a8288">裸堆径向不均匀系数</text><text x="40" y="358" font-size="16" font-weight="600" fill="#1f2328">③ 功率不均匀系数（峰因子）的定义与限值</text><text x="48" y="384" font-size="14" font-weight="600" fill="#2f6fb0">F_q^N = q_max / q_avg</text><text x="300" y="384" font-size="14" font-weight="600" fill="#1f2328">核焓升因子（热管因子）</text><text x="430" y="384" font-size="13" fill="#7a8288">燃料中心温度最高处的线功率与平均值之比，直接决定燃料熔化裕量</text><text x="48" y="410" font-size="14" font-weight="600" fill="#2f6fb0">F_ΔH = Δh_max / Δh_avg</text><text x="300" y="410" font-size="14" font-weight="600" fill="#1f2328">焓升因子</text><text x="430" y="410" font-size="13" fill="#7a8288">冷却剂在 hottest 通道的温升与平均值之比，决定 DNBR 与沸腾裕量</text><text x="48" y="436" font-size="14" font-weight="600" fill="#2f6fb0">F_xy、F_z</text><text x="300" y="436" font-size="14" font-weight="600" fill="#1f2328">径向、轴向峰因子</text><text x="430" y="436" font-size="13" fill="#7a8288">F_q^N = F_xy × F_z，设计准则要求 F_q^N ≤ 约 2.5（压水堆）</text><text x="48" y="462" font-size="14" font-weight="600" fill="#2f6fb0">AO = (P_T − P_B)/(P_T + P_B)</text><text x="300" y="462" font-size="14" font-weight="600" fill="#1f2328">轴向功率偏移</text><text x="430" y="462" font-size="13" fill="#7a8288">上、下半堆功率之差与和之比，只与功率形状有关</text><text x="48" y="488" font-size="14" font-weight="600" fill="#2f6fb0">AFD = (P_T − P_B)/P_N</text><text x="300" y="488" font-size="14" font-weight="600" fill="#1f2328">轴向功率偏差</text><text x="430" y="488" font-size="13" fill="#7a8288">与功率水平有关；100% 功率下 AO = AFD</text><rect x="48" y="502" width="872" height="62" rx="8" stroke="#b45309" fill="#fbf4ea" stroke-width="1.2"/><text x="64" y="524" font-size="14" font-weight="600" fill="#b45309">教材例（第4章 p.74）：P_N = 1000 MWt，P_T = 225 MWt，P_B = 275 MWt</text><text x="64" y="548" font-size="14" fill="#1f2328">→ AO = (225−275)/(225+275) = −10%，AFD = (225−275)/1000 = −5%（下半堆功率偏高）</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第4章 4.4.1 节 p.74~75 与课件第4章 Slide 44~47 自绘</text></g></svg>
