    <text x="40" y="32" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">图 2-18  读零件图的五个步骤（以轴类零件为例）</text>
    <text x="40" y="52" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">五步的顺序不能颠倒：先看清是什么零件，再想形状，最后才读尺寸与技术要求。</text>
