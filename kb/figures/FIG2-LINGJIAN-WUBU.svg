    <text x="142" y="198" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">Ra 3.2</text>
    <line x1="400" y1="196" x2="392" y2="210" stroke="currentColor" stroke-width="0.8"/>
    <line x1="400" y1="196" x2="418" y2="210" stroke="currentColor" stroke-width="0.8"/>
    <text x="424" y="206" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">Ra 3.2</text>
    <text x="70" y="164" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">零件图（轴）：先看视图，再读尺寸与技术要求</text>
    <rect x="60" y="430" width="176" height="76" rx="6" stroke="#2563eb" stroke-width="0.8" fill="none"/>
    <text x="72" y="456" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="#2563eb" font-weight="600">① 看标题栏</text>
    <text x="72" y="478" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">名称、材料、比例、图号</text>
    <line x1="240" y1="468" x2="250" y2="468" stroke="#6b7280" stroke-width="0.8" marker-end="url(#FIG2-LINGJIAN-WUBU__ar-ink)"/>
    <rect x="252" y="430" width="176" height="76" rx="6" stroke="#16a34a" stroke-width="0.8" fill="none"/>
    <text x="264" y="456" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="#16a34a" font-weight="600">② 分析视图</text>
    <text x="264" y="478" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">用了哪些视图、剖视、断面</text>
    <line x1="432" y1="468" x2="442" y2="468" stroke="#6b7280" stroke-width="0.8" marker-end="url(#FIG2-LINGJIAN-WUBU__ar-ink)"/>
    <rect x="444" y="430" width="176" height="76" rx="6" stroke="#ea580c" stroke-width="0.8" fill="none"/>
    <text x="456" y="456" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="#ea580c" font-weight="600">③ 想形体</text>
    <text x="456" y="478" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">分块想象立体形状</text>
    <line x1="624" y1="468" x2="634" y2="468" stroke="#6b7280" stroke-width="0.8" marker-end="url(#FIG2-LINGJIAN-WUBU__ar-ink)"/>
    <rect x="636" y="430" width="176" height="76" rx="6" stroke="#7c3aed" stroke-width="0.8" fill="none"/>
    <text x="648" y="456" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="#7c3aed" font-weight="600">④ 找尺寸基准</text>
    <text x="648" y="478" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">长/宽/高基准在哪</text>
    <line x1="816" y1="468" x2="826" y2="468" stroke="#6b7280" stroke-width="0.8" marker-end="url(#FIG2-LINGJIAN-WUBU__ar-ink)"/>
    <rect x="828" y="430" width="176" height="76" rx="6" stroke="#dc2626" stroke-width="0.8" fill="none"/>
    <text x="840" y="456" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626" font-weight="600">⑤ 读技术要求</text>
    <text x="840" y="478" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">尺寸公差、Ra、热处理</text>
    <text x="60" y="560" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 五步读完，再回头核对：视图与尺寸是否对得上、技术要求和尺寸精度是否与结构相称。</text>
    <text x="60" y="580" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 常见错误：跳过标题栏直接读尺寸（不知道材料和比例）；或只看主视图，不看其他视图就下结论。</text>
  </g>
</svg>
