8" x2="70" y2="464" stroke="#7a8288" stroke-width="1.1" marker-end="url(#FIG-PWR-STRUCTURE_ar_aux)" marker-start="url(#FIG-PWR-STRUCTURE_ar_aux)"/><text x="64" y="300" font-size="15" text-anchor="end" fill="#7a8288">14 m</text><line x1="70" y1="490" x2="312" y2="490" stroke="#7a8288" stroke-width="1.1" marker-end="url(#FIG-PWR-STRUCTURE_ar_aux)" marker-start="url(#FIG-PWR-STRUCTURE_ar_aux)"/><text x="190" y="510" font-size="15" text-anchor="middle" fill="#7a8288">4.5 m</text><line x1="96" y1="128" x2="96" y2="490" stroke="#7a8288" stroke-width="0.8" stroke-dasharray="5 4"/><line x1="312" y1="128" x2="312" y2="490" stroke="#7a8288" stroke-width="0.8" stroke-dasharray="5 4"/><text x="190" y="546" font-size="16" text-anchor="middle" font-weight="600" fill="#1f2328">压力容器（RPV）</text><text x="430" y="112" font-size="16" font-weight="600" fill="#1f2328">堆芯结构尺度的六个层级</text><rect x="430" y="130" width="300" height="46" rx="8" stroke="#7a8288" fill="#ffffff" stroke-width="1.6"/><text x="444" y="152" font-size="16" font-weight="600" fill="#7a8288">压力容器</text><text x="444" y="170" font-size="14" fill="#1f2328">14 m × 4.5 m</text><circle cx="712" cy="153" r="8" stroke="#7a8288" fill="#7a8288" stroke-width="1"/><text x="712" y="158" font-size="13" text-anchor="middle" fill="#ffffff">1</text><line x1="580" y1="176" x2="580" y2="196" stroke="#7a8288" stroke-width="1.3" marker-end="url(#FIG-PWR-STRUCTURE_ar_aux)"/><rect x="430" y="196" width="300" height="46" rx="8" stroke="#2f6fb0" fill="#ffffff" stroke-width="1.6"/><text x="444" y="218" font-size="16" font-weight="600" fill="#2f6fb0">堆芯（活性区）</text><text x="444" y="236" font-size="14" fill="#1f2328">4 m × 4 m</text><circle cx="712" cy="219" r="8" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1"/><text x="712" y="224" font-size="13" text-anchor="middle" fill="#ffffff">2</text><line x1="580" y1="242" x2="580" y2="262" stroke="#2f6fb0" stroke-width="1.3" marker-end="url(#FIG-PWR-STRUCTURE_ar_blue)"/><rect x="430" y="262" width="300" height="46" rx="8" stroke="#0f766e" fill="#ffffff" stroke-width="1.6"/><text x="444" y="284" font-size="16" font-weight="600" fill="#0f766e">燃料组件</text><text x="444" y="302" font-size="14" fill="#1f2328">4 m × 20 cm</text><circle cx="712" cy="285" r="8" stroke="#0f766e" fill="#0f766e" stroke-width="1"/><text x="712" y="290" font-size="13" text-anchor="middle" fill="#ffffff">3</text><line x1="580" y1="308" x2="580" y2="328" stroke="#0f766e" stroke-width="1.3" marker-end="url(#FIG-PWR-STRUCTURE_ar_teal)"/><rect x="430" y="328" width="300" height="46" rx="8" stroke="#2e7d4f" fill="#ffffff" stroke-width="1.6"/><text x="444" y="350" font-size="16" font-weight="600" fill="#2e7d4f">燃料棒</text><text x="444" y="368" font-size="14" fill="#1f2328">4 m × 1 cm（Ø9.5 mm）</text><circle cx="712" cy="351" r="8" stroke="#2e7d4f" fill="#2e7d4f" stroke-width="1"/><text x="712" y="356" font-size="13" text-anchor="middle" fill="#ffffff">4</text><line x1="580" y1="374" x2="580" y2="394" stroke="#2e7d4f" stroke-width="1.3" marker-end="url(#FIG-PWR-STRUCTURE_ar_green)"/><rect x="430" y="394" width="300" height="46" rx="8" stroke="#b45309" fill="#ffffff" stroke-width="1.6"/><text x="444" y="416" font-size="16" font-weight="600" fill="#b45309">定位格架</text><text x="444" y="434" font-size="14" fill="#1f2328">20 cm × 4 cm</text><circle cx="712" cy="417" r="8" stroke="#b45309" fill="#b45309" stroke-width="1"/><text x="712" y="422" font-size="13" text-anchor="middle" fill="#ffffff">5</text><line x1="580" y1="440" x2="580" y2="460" stroke="#b45309" stroke-width="1.3" marker-end="url(#FIG-PWR-STRUCTURE_ar_orange)"/><rect x="430" y="460" width="300" height="46" rx="8" stroke="#c0392b" fill="#ffffff" stroke-width="1.6"/><text x="444" y="482" font-size="16" font-weight="600" fill="#c0392b">燃料芯块</text><text x="444" y="500" font-size="14" fill="#1f2328">1.5 cm × 1 cm（UO₂）</text><circle cx="712" cy="483" r="8" stroke="#c0392b" fill="#c0392b" stroke-width="1"/><text x="712" y="488" font-size="13" text-anchor="middle" fill="#ffffff">6</text><text x="752" y="112" font-size="16" font-weight="600" fill="#1f2328">堆芯的组成材料</text><rect x="752" y="132" width="168" height="48" rx="7" stroke="#c0392b" fill="#ffffff" stroke-width="1.3"/><text x="766" y="152" font-size="15" font-weight="600" fill="#c0392b">核燃料</text><text x="766" y="172" font-size="14" fill="#1f2328">UO₂ 芯块</text><rect x="752" y="194" width="168" height="48" rx="7" stroke="#2f6fb0" fill="#ffffff" stroke-width="1.3"/><text x="766" y="214" font-size="15" font-weight="600" fill="#2f6fb0">冷却剂</text><text x="766" y="234" font-size="14" fill="#1f2328">轻水</text><rect x="752" y="256" width="168" height="48" rx="7" stroke="#0f766e" fill="#ffffff" stroke-width="1.3"/><text x="766" y="276" font-size="15" font-weight="600" fill="#0f766e">慢化剂</text><text x="766" y="296" font-size="14" fill="#1f2328">轻水（兼）</text><rect x="752" y="318" width="168" height="48" rx="7" stroke="#7a8288" fill="#ffffff" stroke-width="1.3"/><text x="766" y="338" font-size="15" font-weight="600" fill="#7a8288">结构材料</text><text x="766" y="358" font-size="14" fill="#1f2328">Zr-4 / 不锈钢</text><rect x="752" y="380" width="168" height="48" rx="7" stroke="#5b4b8a" fill="#ffffff" stroke-width="1.3"/><text x="766" y="400" font-size="15" font-weight="600" fill="#5b4b8a">吸收剂</text><text x="766" y="420" font-size="14" fill="#1f2328">Ag-In-Cd、B、Gd</text><text x="40" y="566" font-size="14" fill="#7a8288">注：PWR 用水既作冷却剂又作慢化剂；控制棒走导向管，可燃毒物与燃料分开布置。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第1章 1.1 节 p.5、第1章 p.7 与课件第1章自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">尺寸为典型 1000 MW 级压水堆量级，用于建立“容器→堆芯→组件→棒→芯块”的尺度层级概念</text></g></svg>
