568" font-size="13" font-weight="600" fill="#2f6fb0">“卡棒”准则</text><text x="166" y="568" font-size="13" fill="#1f2328">价值最大的一束棒卡在堆外时仍能停堆并保持停堆深度（压水堆 &gt; 2~3 $）</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第7章 7.4.1 节 p.121~123 与课件第7章 Slide 18~19 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">取一组控制棒总价值 1200 pcm、行程 300 cm；微分价值 dρ/dz ∝ sin²(πz/H)</text></g></svg>
