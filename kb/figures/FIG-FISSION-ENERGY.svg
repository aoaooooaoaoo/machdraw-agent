<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-FISSION-ENERGY-t FIG-FISSION-ENERGY-d"><title id="FIG-FISSION-ENERGY-t">图 2-4  ²³⁵U 裂变的能量分配（每次裂变约 200 MeV）</title><desc id="FIG-FISSION-ENERGY-d">总释放 207 MeV，其中中微子带走 12 MeV 无法回收；工程上取可回收能量 E_f ≈ 200 MeV ≈ 3.2×10⁻¹¹ J</desc><defs><marker id="FIG-FISSION-ENERGY_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-FISSION-ENERGY_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-FISSION-ENERGY_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-FISSION-ENERGY_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-FISSION-ENERGY_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-FISSION-ENERGY_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-FISSION-ENERGY_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-FISSION-ENERGY_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-FISSION-ENERGY_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 2-4  ²³⁵U 裂变的能量分配（每次裂变约 200 MeV）</text><text x="40" y="66" font-size="15" fill="#7a8288">总释放 207 MeV，其中中微子带走 12 MeV 无法回收；工程上取可回收能量 E_f ≈ 200 MeV ≈ 3.2×10⁻¹¹ J</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><rect x="100" y="190" width="616.8" height="56" rx="0" stroke="#ffffff" fill="#2f6fb0" stroke-width="1.2" opacity="0.85"/><rect x="716.8" y="190" width="18.4" height="56" rx="0" stroke="#ffffff" fill="#0f766e" stroke-width="1.2" opacity="0.85"/><rect x="735.2" y="190" width="25.7" height="56" rx="0" stroke="#ffffff" fill="#2e7d4f" stroke-width="1.2" opacity="0.85"/><rect x="760.9" y="190" width="25.7" height="56" rx="0" stroke="#ffffff" fill="#b45309" stroke-width="1.2" opacity="0.85"/><rect x="786.6" y="190" width="29.4" height="56" rx="0" stroke="#ffffff" fill="#5b4b8a" stroke-width="1.2" opacity="0.85"/><rect x="815.9" y="190" width="44.1" height="56" rx="0" stroke="#ffffff" fill="#b9b2a6" stroke-width="1.2" opacity="0.5"/><line x1="408.4" y1="190" x2="408.4" y2="170" stroke="#2f6fb0" stroke-width="0.9"/><text x="408.4" y="164" font-size="14" text-anchor="middle" font-weight="600" fill="#2f6fb0">裂变碎片动能 168</text><line x1="726" y1="246" x2="726" y2="262" stroke="#0f766e" stroke-width="0.9"/><text x="726" y="276" font-size="14" text-anchor="middle" font-weight="600" fill="#0f766e">中子 5</text><line x1="748" y1="190" x2="748" y2="170" stroke="#2e7d4f" stroke-width="0.9"/><text x="748" y="164" font-size="14" text-anchor="middle" font-weight="600" fill="#2e7d4f">瞬发 γ 7</text><line x1="773.7" y1="246" x2="773.7" y2="262" stroke="#b45309" stroke-width="0.9"/><text x="773.7" y="276" font-size="14" text-anchor="middle" font-weight="600" fill="#b45309">缓发 γ 7</text><line x1="801.3" y1="190" x2="801.3" y2="170" stroke="#5b4b8a" stroke-width="0.9"/><text x="801.3" y="164" font-size="14" text-anchor="middle" font-weight="600" fill="#5b4b8a">缓发 β 8</text><line x1="838" y1="246" x2="838" y2="262" stroke="#7a8288" stroke-width="0.9"/><text x="838" y="276" font-size="14" text-anchor="middle" font-weight="600" fill="#7a8288">中微子 12</text><text x="100" y="138" font-size="14" fill="#7a8288">单位：MeV／次裂变</text><text x="860" y="138" font-size="15" text-anchor="end" font-weight="600" fill="#1f2328">合计 207 MeV</text><text x="40" y="300" font-size="16" font-weight="600" fill="#1f2328">能量的形式、放出时间与可回收比例</text><text x="48" y="328" font-size="15" font-weight="600" fill="#7a8288">能量形式</text><text x="268" y="328" font-size="15" font-weight="600" fill="#7a8288">放出时间</text><text x="430" y="328" font-size="15" font-weight="600" fill="#7a8288">释放能量/MeV</text><text x="660" y="328" font-size="15" font-weight="600" fill="#7a8288">可回收/MeV</text><line x1="40" y1="338" x2="900" y2="338" stroke="#e3e0da" stroke-width="1.2"/><text x="48" y="360" font-size="15" fill="#1f2328">裂变碎片的动能</text><text x="268" y="360" font-size="14" fill="#7a8288">瞬发</text><text x="430" y="360" font-size="15" fill="#1f2328">168</text><text x="660" y="360" font-size="15" fill="#1f2328">168</text><text x="48" y="384" font-size="15" fill="#1f2328">裂变中子的动能</text><text x="268" y="384" font-size="14" fill="#7a8288">瞬发</text><text x="430" y="384" font-size="15" fill="#1f2328">5</text><text x="660" y="384" font-size="15" fill="#1f2328">5</text><text x="48" y="408" font-size="15" fill="#1f2328">瞬发 γ 射线</text><text x="268" y="408" font-size="14" fill="#7a8288">瞬发</text><text x="430" y="408" font-size="15" fill="#1f2328">7</text><text x="660" y="408" font-size="15" fill="#1f2328">7</text><text x="48" y="432" font-size="15" fill="#1f2328">缓发 γ 射线</text><text x="268" y="432" font-size="14" fill="#7a8288">缓发</text><text x="430" y="432" font-size="15" fill="#1f2328">7</text><text x="660" y="432" font-size="15" fill="#1f2328">7</text><text x="48" y="456" font-size="15" fill="#1f2328">缓发 β 射线</text><text x="268" y="456" font-size="14" fill="#7a8288">缓发</text><text x="430" y="456" font-size="15" fill="#1f2328">8</text><text x="660" y="456" font-size="15" fill="#1f2328">8</text><text x="48" y="480" font-size="15" fill="#1f2328">中微子</text><text x="268" y="480" font-size="14" fill="#7a8288">缓发</text><text x="430" y="480" font-size="15" fill="#1f2328">12</text><text x="660" y="480" font-size="15" fill="#1f2328">—（穿出堆芯）</text><text x="48" y="504" font-size="15" fill="#1f2328">俘获 γ 射线（结合能）</text><text x="268" y="504" font-size="14" fill="#7a8288">缓发</text><text x="430" y="504" font-size="15" fill="#1f2328">—</text><text x="660" y="504" font-size="15" fill="#1f2328">3~12</text><text x="48" y="528" font-size="15" font-weight="600" fill="#c0392b">合计</text><text x="268" y="528" font-size="14" fill="#c0392b">—</text><text x="430" y="528" font-size="15" fill="#c0392b">207</text><text x="660" y="528" font-size="15" fill="#c0392b">198~207</text><line x1="40" y1="536" x2="900" y2="536" stroke="#e3e0da" stroke-width="1.2"/><rect x="40" y="494" width="500" height="70" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.3"/><text x="56" y="518" font-size="15" font-weight="600" fill="#2f6fb0">工程换算</text><text x="56" y="542" font-size="14" fill="#1f2328">200 MeV = 3.2×10⁻¹¹ J；1 J 需要 3.125×10¹⁰ 次裂变</text><rect x="560" y="494" width="340" height="70" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.3"/><text x="576" y="518" font-size="15" font-weight="600" fill="#c0392b">反应堆热功率</text><text x="576" y="542" font-size="14" fill="#1f2328">P = E_f Σ_f Φ V（W）</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第2章 2.5.2 节 p.24、2.5.3 节 p.25 与课件第2章 表（裂变能量）自绘</text></g></svg>
