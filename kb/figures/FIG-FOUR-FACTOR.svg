<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-FOUR-FACTOR-t FIG-FOUR-FACTOR-d"><title id="FIG-FOUR-FACTOR-t">图 3-2  热中子堆的四因子中子循环（以 100 个裂变中子为例）</title><desc id="FIG-FOUR-FACTOR-d">从 100 个快中子出发绕行一周：ε 倍增 → 慢化泄漏 Ps → 共振吸收 p → 热中子泄漏 Pd → 非燃料吸收 f → 有效裂变中子数 η</desc><defs><marker id="FIG-FOUR-FACTOR_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-FOUR-FACTOR_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-FOUR-FACTOR_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-FOUR-FACTOR_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-FOUR-FACTOR_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-FOUR-FACTOR_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-FOUR-FACTOR_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-FOUR-FACTOR_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-FOUR-FACTOR_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 3-2  热中子堆的四因子中子循环（以 100 个裂变中子为例）</text><text x="40" y="66" font-size="15" fill="#7a8288">从 100 个快中子出发绕行一周：ε 倍增 → 慢化泄漏 Ps → 共振吸收 p → 热中子泄漏 Pd → 非燃料吸收 f → 有效裂变中子数 η</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><rect x="68" y="118" width="168" height="60" rx="9" stroke="#2f6fb0" fill="#ffffff" stroke-width="1.8"/><text x="152" y="142" font-size="13" text-anchor="middle" font-weight="600" fill="#2f6fb0">第 n 代裂变中子</text><text x="152" y="165" font-size="16" text-anchor="middle" font-weight="600" fill="#1f2328">n = 100</text><rect x="724" y="118" width="168" height="60" rx="9" stroke="#0f766e" fill="#ffffff" stroke-width="1.8"/><text x="808" y="142" font-size="13" text-anchor="middle" font-weight="600" fill="#0f766e">快中子倍增后</text><text x="808" y="165" font-size="16" text-anchor="middle" font-weight="600" fill="#1f2328">n = 105</text><rect x="724" y="456" width="168" height="60" rx="9" stroke="#b45309" fill="#ffffff" stroke-width="1.8"/><text x="808" y="480" font-size="13" text-anchor="middle" font-weight="600" fill="#b45309">慢化成热中子后</text><text x="808" y="503" font-size="16" text-anchor="middle" font-weight="600" fill="#1f2328">n = 90</text><line x1="238" y1="148" x2="300" y2="148" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-FOUR-FACTOR_ar_teal)"/><rect x="304" y="116" width="352" height="64" rx="8" stroke="#0f766e" fill="#e6f2ef" stroke-width="1.3"/><text x="318" y="139" font-size="14.5" font-weight="600" fill="#0f766e">① ε = 1.05　快中子倍增系数</text><text x="318" y="162" font-size="12.5" fill="#0f766e">²³⁸U 快中子引起裂变：100 → 105</text><line x1="660" y1="148" x2="720" y2="148" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-FOUR-FACTOR_ar_teal)"/><line x1="808" y1="180" x2="808" y2="216" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-FOUR-FACTOR_ar_teal)"/><rect x="700" y="220" width="216" height="96" rx="8" stroke="#0f766e" fill="#e6f2ef" stroke-width="1.3"/><text x="712" y="242" font-size="13" font-weight="600" fill="#0f766e">② Ps = 100/105</text><text x="712" y="262" font-size="11.5" fill="#1f2328">慢化不泄漏（轻水慢化）</text><text x="712" y="282" font-size="11.5" fill="#1f2328">慢化中泄漏 5 个：105 → 100</text><text x="712" y="302" font-size="11" fill="#7a8288">慢化段 2 MeV → 1 eV</text><line x1="808" y1="316" x2="808" y2="344" stroke="#b45309" stroke-width="2" marker-end="url(#FIG-FOUR-FACTOR_ar_orange)"/><rect x="700" y="348" width="216" height="92" rx="8" stroke="#b45309" fill="#fbf2e6" stroke-width="1.3"/><text x="712" y="370" font-size="13" font-weight="600" fill="#b45309">③ p = 0.90</text><text x="712" y="390" font-size="11.5" fill="#1f2328">逃脱共振俘获概率</text><text x="712" y="410" font-size="11.5" fill="#1f2328">²³⁸U 共振吸收 10 个：100 → 90</text><text x="712" y="430" font-size="11" fill="#7a8288">共振区 1 ~ 10³ eV</text><line x1="808" y1="440" x2="808" y2="458" stroke="#b45309" stroke-width="2" marker-end="url(#FIG-FOUR-FACTOR_ar_orange)"/><line x1="722" y1="486" x2="664" y2="486" stroke="#2f6fb0" stroke-width="2" marker-end="url(#FIG-FOUR-FACTOR_ar_blue)"/><rect x="340" y="450" width="320" height="72" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.3"/><text x="352" y="472" font-size="13" font-weight="600" fill="#2f6fb0">④ Pd = 85/90</text><text x="352" y="492" font-size="11.5" fill="#1f2328">扩散不泄漏概率（热中子）</text><text x="352" y="512" font-size="11.5" fill="#1f2328">热中子泄漏 5 个：90 → 85</text><line x1="340" y1="486" x2="300" y2="486" stroke="#2f6fb0" stroke-width="2" marker-end="url(#FIG-FOUR-FACTOR_ar_blue)"/><rect x="52" y="450" width="242" height="72" rx="8" stroke="#5b4b8a" fill="#f2eef8" stroke-width="1.3"/><text x="64" y="472" font-size="13" font-weight="600" fill="#5b4b8a">⑤ f = 75/85</text><text x="64" y="492" font-size="11.5" fill="#1f2328">热中子利用系数</text><text x="64" y="512" font-size="11.5" fill="#1f2328">非燃料吸收 10 个：85 → 75</text><line x1="176" y1="450" x2="176" y2="428" stroke="#c0392b" stroke-width="2" marker-end="url(#FIG-FOUR-FACTOR_ar_red)"/><text x="184" y="444" font-size="12" font-weight="600" fill="#c0392b">n = 75</text><rect x="40" y="296" width="226" height="132" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.3"/><text x="52" y="320" font-size="13.5" font-weight="600" fill="#c0392b">⑥ η = 100/75</text><text x="52" y="340" font-size="11.5" fill="#1f2328">有效裂变中子数</text><text x="52" y="360" font-size="11.5" fill="#1f2328">燃料每吸收 1 个热中子，</text><text x="52" y="378" font-size="11.5" fill="#1f2328">放出 ν/(1+α) ≈ 1.33 个快中子</text><text x="52" y="400" font-size="11.5" fill="#c0392b">75 个吸收 → 100 个新快中子</text><text x="52" y="418" font-size="11" fill="#7a8288">（换一批燃料就改变 η）</text><line x1="152" y1="296" x2="152" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#FIG-FOUR-FACTOR_ar_red)"/><text x="160" y="250" font-size="12" fill="#c0392b">循环闭合</text><rect x="300" y="214" width="370" height="166" rx="10" stroke="#1f2328" fill="#ffffff" stroke-width="1.4"/><text x="485" y="240" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">两个层次的增殖因数</text><text x="485" y="272" font-size="18" text-anchor="middle" font-weight="600" fill="#2f6fb0">k∞ = ε p f η = 1.112</text><text x="485" y="294" font-size="11.5" text-anchor="middle" fill="#7a8288">（无限介质：只与材料有关）</text><text x="485" y="326" font-size="18" text-anchor="middle" font-weight="600" fill="#c0392b">k_eff = k∞ · Ps · Pd</text><text x="485" y="350" font-size="13" text-anchor="middle" fill="#1f2328">= 1.112 × (100/105) × (85/90)</text><text x="485" y="372" font-size="14" text-anchor="middle" font-weight="600" fill="#c0392b">= 1.000　（临界）</text><text x="40" y="566" font-size="13.5" fill="#7a8288">注：ε、η 是“中子数放大”，p、f、Ps、Pd 是“损失折扣”；k∞ 只看材料，k_eff 还要扣掉几何泄漏。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第3章 3.1.2 节 p.31~33 与课件第3章 Slide 9~12 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">本例取 ε=1.05、Ps=100/105、p=0.90、Pd=85/90、f=75/85、η=100/75</text></g></svg>
