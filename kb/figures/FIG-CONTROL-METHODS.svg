<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-CONTROL-METHODS-t FIG-CONTROL-METHODS-d"><title id="FIG-CONTROL-METHODS-t">图 7-4  三种反应性控制方式的比较</title><desc id="FIG-CONTROL-METHODS-d">控制棒反应快但扰动功率分布；可燃毒物“自燃”补偿燃耗；可溶硼分布均匀、承担最大的反应性份额</desc><defs><marker id="FIG-CONTROL-METHODS_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-CONTROL-METHODS_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-CONTROL-METHODS_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-CONTROL-METHODS_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-CONTROL-METHODS_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-CONTROL-METHODS_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-CONTROL-METHODS_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-CONTROL-METHODS_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-CONTROL-METHODS_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 7-4  三种反应性控制方式的比较</text><text x="40" y="66" font-size="15" fill="#7a8288">控制棒反应快但扰动功率分布；可燃毒物“自燃”补偿燃耗；可溶硼分布均匀、承担最大的反应性份额</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><text x="40" y="116" font-size="16" font-weight="600" fill="#1f2328">① 三种控制方式承担的反应性总量</text><text x="48" y="162" font-size="14" font-weight="600" fill="#2f6fb0">可溶硼（化学补偿）</text><rect x="240" y="144" width="560" height="26" rx="0" stroke="none" fill="#2f6fb0" stroke-width="0" opacity="0.75"/><text x="808" y="162" font-size="14" font-weight="600" fill="#2f6fb0">17000 pcm</text><text x="48" y="204" font-size="14" font-weight="600" fill="#b45309">可燃毒物（B/Gd）</text><rect x="240" y="186" width="263.5" height="26" rx="0" stroke="none" fill="#b45309" stroke-width="0" opacity="0.75"/><text x="511.5" y="204" font-size="14" font-weight="600" fill="#b45309">8000 pcm</text><text x="48" y="246" font-size="14" font-weight="600" fill="#c0392b">控制棒</text><rect x="240" y="228" width="230.6" height="26" rx="0" stroke="none" fill="#c0392b" stroke-width="0" opacity="0.75"/><text x="478.6" y="246" font-size="14" font-weight="600" fill="#c0392b">7000 pcm</text><text x="240" y="274" font-size="12" fill="#7a8288">0</text><text x="800" y="274" font-size="12" text-anchor="end" fill="#7a8288">18000 pcm</text><text x="40" y="312" font-size="16" font-weight="600" fill="#1f2328">② 三种方式的分工与代价</text><text x="48" y="338" font-size="14" font-weight="600" fill="#7a8288"></text><text x="250" y="338" font-size="14" font-weight="600" fill="#2f6fb0">控制棒</text><text x="470" y="338" font-size="14" font-weight="600" fill="#2f6fb0">可燃毒物</text><text x="700" y="338" font-size="14" font-weight="600" fill="#2f6fb0">可溶硼</text><line x1="40" y1="346" x2="900" y2="346" stroke="#e3e0da" stroke-width="1.2"/><text x="48" y="368" font-size="13" fill="#7a8288">响应速度</text><text x="250" y="368" font-size="13" fill="#1f2328">快（秒级）</text><text x="470" y="368" font-size="13" fill="#1f2328">很慢（随燃耗）</text><text x="700" y="368" font-size="13" fill="#1f2328">慢（分钟~小时）</text><text x="48" y="392" font-size="13" fill="#7a8288">主要任务</text><text x="250" y="392" font-size="13" fill="#1f2328">停堆、功率调节、</text><text x="470" y="392" font-size="13" fill="#1f2328">补偿剩余反应性</text><text x="700" y="392" font-size="13" fill="#1f2328">补偿燃耗与氙钐</text><text x="48" y="416" font-size="13" fill="#7a8288"></text><text x="250" y="416" font-size="13" fill="#1f2328">补偿快变化效应</text><text x="470" y="416" font-size="13" fill="#1f2328"></text><text x="700" y="416" font-size="13" fill="#1f2328"></text><text x="48" y="440" font-size="13" fill="#7a8288">对功率分布</text><text x="250" y="440" font-size="13" fill="#1f2328">扰动大、峰因子↑</text><text x="470" y="440" font-size="13" fill="#1f2328">可展平分布</text><text x="700" y="440" font-size="13" fill="#1f2328">几乎无扰动</text><text x="48" y="464" font-size="13" fill="#7a8288">典型缺点</text><text x="250" y="464" font-size="13" fill="#1f2328">需驱动机构、空间受限</text><text x="470" y="464" font-size="13" fill="#1f2328">布置后不可调、寿期惩罚</text><text x="700" y="464" font-size="13" fill="#1f2328">需硼稀释系统；高硼使 α_M 变正</text><text x="510" y="312" font-size="16" font-weight="600" fill="#1f2328">③ 被控反应性的量级（pcm）</text><text x="510" y="368" font-size="12" font-weight="600" fill="#b45309">氙、钐中毒</text><line x1="600" y1="364" x2="660" y2="364" stroke="#b45309" stroke-width="5" opacity="0.55"/><line x1="660" y1="364" x2="900" y2="364" stroke="#b45309" stroke-width="5"/><text x="776" y="368" font-size="11" fill="#7a8288">~4 pcm/min</text><text x="510" y="396" font-size="12" font-weight="600" fill="#0f766e">燃耗</text><line x1="600" y1="392" x2="660" y2="392" stroke="#0f766e" stroke-width="5" opacity="0.55"/><line x1="660" y1="392" x2="696" y2="392" stroke="#0f766e" stroke-width="5"/><text x="776" y="396" font-size="11" fill="#7a8288">~17 pcm/d</text><text x="510" y="424" font-size="12" font-weight="600" fill="#2f6fb0">温度亏损</text><line x1="600" y1="420" x2="624" y2="420" stroke="#2f6fb0" stroke-width="5" opacity="0.55"/><line x1="624" y1="420" x2="660" y2="420" stroke="#2f6fb0" stroke-width="5"/><text x="776" y="424" font-size="11" fill="#7a8288">~500 pcm/h</text><text x="510" y="452" font-size="12" font-weight="600" fill="#c0392b">紧急停堆</text><line x1="600" y1="448" x2="624" y2="448" stroke="#c0392b" stroke-width="5" opacity="0.55"/><line x1="624" y1="448" x2="648" y2="448" stroke="#c0392b" stroke-width="5"/><text x="776" y="452" font-size="11" fill="#7a8288">&lt;2000 pcm/s</text><text x="510" y="480" font-size="12" font-weight="600" fill="#5b4b8a">功率亏损</text><line x1="600" y1="476" x2="612" y2="476" stroke="#5b4b8a" stroke-width="5" opacity="0.55"/><line x1="612" y1="476" x2="624" y2="476" stroke="#5b4b8a" stroke-width="5"/><text x="776" y="480" font-size="11" fill="#7a8288">~50 pcm/min</text><text x="510" y="508" font-size="12" font-weight="600" fill="#2e7d4f">功率调节</text><line x1="600" y1="504" x2="601.2" y2="504" stroke="#2e7d4f" stroke-width="5" opacity="0.55"/><line x1="601.2" y1="504" x2="602.4" y2="504" stroke="#2e7d4f" stroke-width="5"/><text x="776" y="508" font-size="11" fill="#7a8288">~100 pcm/min</text><text x="600" y="356" font-size="11" fill="#7a8288">条形 = 数值范围，右侧为典型变化率</text><text x="40" y="552" font-size="14" fill="#7a8288">分工原则：控制棒管“快”和“停堆”，可溶硼管“慢”和“量大”，可燃毒物管“寿期初多余反应性”的展平。</text><text x="40" y="574" font-size="14" fill="#7a8288">教材表7-1 的数值说明：在压水堆中可溶硼承担的控制份额最高，这也是压水堆必须有硼稀释系统的原因。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第7章 7.4 节 p.120~127（表7-1）与课件第7章 Slide 11~30 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">总价值：控制棒 7000 pcm、可燃毒物 8000 pcm、可溶硼 17000 pcm（教材 表7-1）</text></g></svg>
