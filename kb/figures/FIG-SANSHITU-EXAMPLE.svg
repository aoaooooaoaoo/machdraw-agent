  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="40" y="32" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">图 3  组合体三视图示例（台阶 + 通孔 + 尺寸基准）</text>
    <text x="40" y="52" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">底板 90×50×20，左端台阶 40×50×25，Ø16 竖直通孔 —— 单位 mm，k = 2 px/mm。</text>
