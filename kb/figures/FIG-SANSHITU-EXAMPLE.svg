<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 682" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG-SANSHITU-EXAMPLE-t FIG-SANSHITU-EXAMPLE-d" class="fig-svg">
  <title id="FIG-SANSHITU-EXAMPLE-t">组合体三视图示例：台阶与通孔</title>
  <desc id="FIG-SANSHITU-EXAMPLE-d">带台阶和竖直通孔的底板，按第一角画出三视图，标出高度、长度、宽度三个尺寸基准，并注明长对正、高平齐、宽相等的对应关系。</desc>
  <defs>
  <pattern id="FIG-SANSHITU-EXAMPLE__hatch45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-SANSHITU-EXAMPLE__hatch135" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-SANSHITU-EXAMPLE__hatch45d" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-SANSHITU-EXAMPLE__hatch_solid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f2937" stroke-width="0.8"/>
  </pattern>
