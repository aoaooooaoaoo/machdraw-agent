    <line x1="80" y1="117" x2="80" y2="91" stroke="currentColor" stroke-width="0.8"/>
    <line x1="160" y1="117" x2="160" y2="91" stroke="currentColor" stroke-width="0.8"/>
    <line x1="232" y1="318" x2="300" y2="404" stroke="currentColor" stroke-width="0.8" marker-end="url(#FIG-SANSHITU-EXAMPLE__ar-ink)"/>
    <text x="306" y="408" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">Ø16 通孔</text>
    <text x="40" y="660" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">读图顺序：先找形状特征视图（这里俯视图最清楚），再按长对正/高平齐/宽相等补出另两个视图；三个方向的尺寸基准各选一个面或中心面，同一方向的尺寸都从该基准出发。</text>
