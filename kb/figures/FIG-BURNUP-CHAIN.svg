<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-BURNUP-CHAIN-t FIG-BURNUP-CHAIN-d"><title id="FIG-BURNUP-CHAIN-t">图 6-4  重同位素的燃耗链：²³⁸U→²³⁹Pu 与 ²³⁵U 的消耗</title><desc id="FIG-BURNUP-CHAIN-d">²³⁸U 俘获中子后经两次 β⁻ 衰变生成易裂变的 ²³⁹Pu；²³⁹Pu 又可能俘获成 ²⁴⁰Pu、²⁴¹Pu</desc><defs><marker id="FIG-BURNUP-CHAIN_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-BURNUP-CHAIN_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-BURNUP-CHAIN_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-BURNUP-CHAIN_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-BURNUP-CHAIN_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-BURNUP-CHAIN_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-BURNUP-CHAIN_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-BURNUP-CHAIN_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-BURNUP-CHAIN_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 6-4  重同位素的燃耗链：²³⁸U→²³⁹Pu 与 ²³⁵U 的消耗</text><text x="40" y="66" font-size="15" fill="#7a8288">²³⁸U 俘获中子后经两次 β⁻ 衰变生成易裂变的 ²³⁹Pu；²³⁹Pu 又可能俘获成 ²⁴⁰Pu、²⁴¹Pu</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><text x="40" y="112" font-size="16" font-weight="600" fill="#1f2328">① ²³⁸U 的转换链（可转换核素 → 易裂变核素）</text><rect x="60" y="146" width="140" height="66" rx="8" stroke="#7a8288" fill="#f2f0ec" stroke-width="1.4"/><text x="130" y="174.1" font-size="15" text-anchor="middle" fill="#1f2328">²³⁸U</text><text x="130" y="194.1" font-size="15" text-anchor="middle" fill="#1f2328">σ_γ = 2.7 b</text><line x1="200" y1="179" x2="250" y2="179" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_teal)"/><text x="225" y="170" font-size="13" text-anchor="middle" fill="#0f766e">(n,γ)</text><rect x="250" y="146" width="140" height="66" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.4"/><text x="320" y="174.1" font-size="15" text-anchor="middle" fill="#1f2328">²³⁹U</text><text x="320" y="194.1" font-size="15" text-anchor="middle" fill="#1f2328">T½ = 23.5 min</text><line x1="390" y1="179" x2="440" y2="179" stroke="#2f6fb0" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_blue)"/><text x="415" y="170" font-size="13" text-anchor="middle" fill="#2f6fb0">β⁻</text><rect x="440" y="146" width="140" height="66" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.4"/><text x="510" y="174.1" font-size="15" text-anchor="middle" fill="#1f2328">²³⁹Np</text><text x="510" y="194.1" font-size="15" text-anchor="middle" fill="#1f2328">T½ = 2.35 d</text><line x1="580" y1="179" x2="630" y2="179" stroke="#2f6fb0" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_blue)"/><text x="605" y="170" font-size="13" text-anchor="middle" fill="#2f6fb0">β⁻</text><rect x="630" y="146" width="150" height="66" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.4"/><text x="705" y="174.1" font-size="15" text-anchor="middle" fill="#1f2328">²³⁹Pu</text><text x="705" y="194.1" font-size="15" text-anchor="middle" fill="#1f2328">易裂变，σ_f=748 b</text><line x1="780" y1="179" x2="830" y2="179" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_teal)"/><text x="805" y="170" font-size="13" text-anchor="middle" fill="#0f766e">(n,γ)</text><rect x="830" y="146" width="90" height="66" rx="8" stroke="#b45309" fill="#fbf2e6" stroke-width="1.4"/><text x="875" y="184.1" font-size="15" text-anchor="middle" fill="#1f2328">²⁴⁰Pu</text><text x="40" y="258" font-size="16" font-weight="600" fill="#1f2328">② 钚同位素的演化与 ²³⁵U 的消耗</text><rect x="100" y="292" width="150" height="66" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.4"/><text x="175" y="320.1" font-size="15" text-anchor="middle" fill="#1f2328">²³⁹Pu</text><text x="175" y="340.1" font-size="15" text-anchor="middle" fill="#1f2328">易裂变</text><line x1="250" y1="310" x2="320" y2="310" stroke="#c0392b" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_red)"/><text x="285" y="300" font-size="13" text-anchor="middle" fill="#c0392b">(n,f)</text><rect x="320" y="292" width="150" height="66" rx="8" stroke="#c0392b" fill="#ffffff" stroke-width="1.4"/><text x="395" y="320.1" font-size="15" text-anchor="middle" fill="#1f2328">裂变碎片</text><text x="395" y="340.1" font-size="15" text-anchor="middle" fill="#1f2328">释放约 200 MeV</text><line x1="250" y1="340" x2="320" y2="360" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_teal)"/><text x="280" y="366" font-size="13" text-anchor="middle" fill="#0f766e">(n,γ)</text><rect x="320" y="366" width="150" height="66" rx="8" stroke="#b45309" fill="#fbf2e6" stroke-width="1.4"/><text x="395" y="394.1" font-size="15" text-anchor="middle" fill="#1f2328">²⁴⁰Pu</text><text x="395" y="414.1" font-size="15" text-anchor="middle" fill="#1f2328">T½ = 6560 a</text><line x1="470" y1="399" x2="540" y2="399" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_teal)"/><text x="505" y="390" font-size="13" text-anchor="middle" fill="#0f766e">(n,γ)</text><rect x="540" y="366" width="150" height="66" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.4"/><text x="615" y="394.1" font-size="15" text-anchor="middle" fill="#1f2328">²⁴¹Pu</text><text x="615" y="414.1" font-size="15" text-anchor="middle" fill="#1f2328">易裂变，T½=14.4 a</text><line x1="690" y1="399" x2="750" y2="399" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_teal)"/><text x="720" y="390" font-size="13" text-anchor="middle" fill="#0f766e">(n,γ)</text><rect x="750" y="366" width="150" height="66" rx="8" stroke="#7a8288" fill="#f2f0ec" stroke-width="1.4"/><text x="825" y="394.1" font-size="15" text-anchor="middle" fill="#1f2328">²⁴²Pu</text><text x="825" y="414.1" font-size="15" text-anchor="middle" fill="#1f2328">吸收中子（损失）</text><rect x="600" y="292" width="150" height="66" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.4"/><text x="675" y="320.1" font-size="15" text-anchor="middle" fill="#1f2328">²³⁵U</text><text x="675" y="340.1" font-size="15" text-anchor="middle" fill="#1f2328">易裂变，σ_f=585 b</text><line x1="750" y1="310" x2="820" y2="310" stroke="#c0392b" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_red)"/><text x="785" y="300" font-size="13" text-anchor="middle" fill="#c0392b">(n,f)</text><rect x="820" y="292" width="110" height="66" rx="8" stroke="#c0392b" fill="#ffffff" stroke-width="1.4"/><text x="875" y="320.1" font-size="15" text-anchor="middle" fill="#1f2328">裂变产物</text><text x="875" y="340.1" font-size="15" text-anchor="middle" fill="#1f2328">＋能量</text><line x1="675" y1="358" x2="675" y2="380" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-BURNUP-CHAIN_ar_teal)"/><text x="690" y="374" font-size="12" fill="#0f766e">(n,γ)</text><rect x="40" y="452" width="880" height="88" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.2"/><text x="56" y="476" font-size="15" font-weight="600" fill="#2f6fb0">对反应性意味着什么</text><text x="56" y="500" font-size="14" fill="#1f2328">① ²³⁸U 俘获产生 ²³⁹Pu，部分补偿 ²³⁵U 的消耗，使 k_eff 随燃耗的下降变慢（钚的“再生”效应）；</text><text x="56" y="522" font-size="14" fill="#1f2328">② 但 ²⁴⁰Pu、²⁴²Pu 只吸收不裂变，是燃耗后期的“寄生吸收”，最终 k_eff 仍单调下降。</text><text x="40" y="564" font-size="14" fill="#7a8288">燃耗方程就是把这张网络里每个核素的产生项与消失项写成微分方程组（教材 6-1~6-3 式），再用数值方法求解。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第6章 6.1 节 p.98~100 与课件第6章 Slide 11 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">²³⁹U：T½=23.5 min；²³⁹Np：T½=2.35 d；²⁴¹Pu 为易裂变核素，是热堆后期反应性的重要来源</text></g></svg>
