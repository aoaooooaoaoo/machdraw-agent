<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-DESIGN-FLOW-t FIG-DESIGN-FLOW-d"><title id="FIG-DESIGN-FLOW-t">图 10-2  堆芯核设计流程</title><desc id="FIG-DESIGN-FLOW-d">从设计准则出发，选定初始参数，经栅元/组件—堆芯的逐级计算与专项校核，最后用启动物理试验验证</desc><defs><marker id="FIG-DESIGN-FLOW_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-DESIGN-FLOW_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-DESIGN-FLOW_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-DESIGN-FLOW_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-DESIGN-FLOW_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-DESIGN-FLOW_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-DESIGN-FLOW_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-DESIGN-FLOW_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-DESIGN-FLOW_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 10-2  堆芯核设计流程</text><text x="40" y="66" font-size="15" fill="#7a8288">从设计准则出发，选定初始参数，经栅元/组件—堆芯的逐级计算与专项校核，最后用启动物理试验验证</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><rect x="46" y="100" width="430" height="44" rx="8" stroke="#2f6fb0" fill="#ffffff" stroke-width="1.6"/><text x="60" y="119" font-size="13" font-weight="600" fill="#2f6fb0">① 设计准则与总体要求</text><text x="60" y="136" font-size="11" fill="#7a8288">负反馈、引入率限制、停堆裕量、燃耗限值</text><line x1="261" y1="144" x2="261" y2="154" stroke="#7a8288" stroke-width="1.6" marker-end="url(#FIG-DESIGN-FLOW_ar_aux)"/><rect x="46" y="154" width="430" height="44" rx="8" stroke="#2f6fb0" fill="#ffffff" stroke-width="1.6"/><text x="60" y="173" font-size="13" font-weight="600" fill="#2f6fb0">② 堆芯初始参数选择</text><text x="60" y="190" font-size="11" fill="#7a8288">富集度、棒径、包壳、水-铀比、堆芯尺寸</text><line x1="261" y1="198" x2="261" y2="208" stroke="#7a8288" stroke-width="1.6" marker-end="url(#FIG-DESIGN-FLOW_ar_aux)"/><rect x="46" y="208" width="430" height="44" rx="8" stroke="#0f766e" fill="#ffffff" stroke-width="1.6"/><text x="60" y="227" font-size="13" font-weight="600" fill="#0f766e">③ 栅元与组件计算</text><text x="60" y="244" font-size="11" fill="#7a8288">输运计算 → 群常数、少群截面拟合</text><line x1="261" y1="252" x2="261" y2="262" stroke="#7a8288" stroke-width="1.6" marker-end="url(#FIG-DESIGN-FLOW_ar_aux)"/><rect x="46" y="262" width="430" height="44" rx="8" stroke="#0f766e" fill="#ffffff" stroke-width="1.6"/><text x="60" y="281" font-size="13" font-weight="600" fill="#0f766e">④ 堆芯扩散与燃耗计算</text><text x="60" y="298" font-size="11" fill="#7a8288">k_eff、功率分布、临界硼浓度随燃耗</text><line x1="261" y1="306" x2="261" y2="316" stroke="#7a8288" stroke-width="1.6" marker-end="url(#FIG-DESIGN-FLOW_ar_aux)"/><rect x="46" y="316" width="430" height="44" rx="8" stroke="#5b4b8a" fill="#ffffff" stroke-width="1.6"/><text x="60" y="335" font-size="13" font-weight="600" fill="#5b4b8a">⑤ 专项计算与校核</text><text x="60" y="352" font-size="11" fill="#7a8288">功率能力、反应性控制、反应性系数、动态参数</text><line x1="261" y1="360" x2="261" y2="370" stroke="#7a8288" stroke-width="1.6" marker-end="url(#FIG-DESIGN-FLOW_ar_aux)"/><rect x="46" y="370" width="430" height="44" rx="8" stroke="#b45309" fill="#ffffff" stroke-width="1.6"/><text x="60" y="389" font-size="13" font-weight="600" fill="#b45309">⑥ 安全评价</text><text x="60" y="406" font-size="11" fill="#7a8288">F_Q、停堆裕量、MTC、氙振荡</text><line x1="261" y1="414" x2="261" y2="424" stroke="#7a8288" stroke-width="1.6" marker-end="url(#FIG-DESIGN-FLOW_ar_aux)"/><rect x="46" y="424" width="430" height="44" rx="8" stroke="#c0392b" fill="#ffffff" stroke-width="1.6"/><text x="60" y="443" font-size="13" font-weight="600" fill="#c0392b">⑦ 启动物理试验</text><text x="60" y="460" font-size="11" fill="#7a8288">临界、零功率试验、提升功率试验</text><line x1="261" y1="468" x2="261" y2="478" stroke="#7a8288" stroke-width="1.6" marker-end="url(#FIG-DESIGN-FLOW_ar_aux)"/><rect x="46" y="478" width="430" height="44" rx="8" stroke="#a04b7a" fill="#ffffff" stroke-width="1.6"/><text x="60" y="497" font-size="13" font-weight="600" fill="#a04b7a">⑧ 换料堆芯安全评价</text><text x="60" y="514" font-size="11" fill="#7a8288">关键安全参数包络性验证</text><rect x="510" y="104" width="410" height="150" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.3"/><text x="526" y="128" font-size="14" font-weight="600" fill="#2f6fb0">五个设计准则（教材 10.1 节 p.163）</text><text x="526" y="152" font-size="12" fill="#1f2328">1. 堆芯具有负的反应性反馈</text><text x="526" y="172" font-size="12" fill="#1f2328">2. 最大反应性的引入率不超过限值</text><text x="526" y="192" font-size="12" fill="#1f2328">3. 具有足够的停堆裕量</text><text x="526" y="212" font-size="12" fill="#1f2328">4. 满足平均/最大燃耗深度限值</text><text x="526" y="232" font-size="12" fill="#1f2328">5. 运行中不发生功率振荡</text><rect x="510" y="288" width="410" height="132" rx="8" stroke="#5b4b8a" fill="#f2eef8" stroke-width="1.3"/><text x="526" y="312" font-size="14" font-weight="600" fill="#5b4b8a">两个层次的迭代</text><text x="526" y="336" font-size="12" fill="#1f2328">内层：组件计算 ⇄ 堆芯计算（群常数与通量）</text><text x="526" y="358" font-size="12" fill="#1f2328">外层：改变装载/富集度/棒位，重算到满足准则</text><text x="526" y="382" font-size="12" fill="#5b4b8a">判据不满足 → 回到 ② 调整参数（图中虚线）</text><text x="526" y="404" font-size="12" fill="#7a8288">收敛后才进入安全评价与启动试验</text><line x1="492" y1="330" x2="480" y2="330" stroke="#5b4b8a" stroke-width="1.4" stroke-dasharray="6 4"/><line x1="492" y1="330" x2="492" y2="176" stroke="#5b4b8a" stroke-width="1.4" stroke-dasharray="6 4"/><line x1="492" y1="176" x2="478" y2="176" stroke="#5b4b8a" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#FIG-DESIGN-FLOW_ar_violet)"/><rect x="46" y="528" width="874" height="46" rx="8" stroke="#b45309" fill="#fbf4ea" stroke-width="1.2"/><text x="60" y="548" font-size="12" fill="#1f2328">设计输出的核心量：寿期内各时刻的功率分布与峰因子、临界硼浓度曲线、控制棒价值与停堆裕量、</text><text x="60" y="566" font-size="12" fill="#1f2328">燃料温度系数/慢化剂温度系数/硼微分价值、缓发中子份额与瞬发中子寿命（供动态分析与安全分析使用）。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第10章 10.1~10.4 节 p.163~176 与课件第10章 Slide 3~17 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">五个设计准则：负反应性反馈、反应性引入率受限、足够停堆裕量、燃耗限值、不发生功率振荡</text></g></svg>
