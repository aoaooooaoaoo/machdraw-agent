<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1034 614" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG-GONGCHA-PEIJIAN-t FIG-GONGCHA-PEIJIAN-d" class="fig-svg">
  <title id="FIG-GONGCHA-PEIJIAN-t">三种配合的公差带对照：间隙、过渡、过盈</title>
  <desc id="FIG-GONGCHA-PEIJIAN-d">同一基本尺寸 Φ30 下，H7/g6 为间隙配合、H7/k6 为过渡配合、H7/s6 为过盈配合；通过孔带与轴带的相对位置判断配合性质。</desc>
  <defs>
  <pattern id="FIG-GONGCHA-PEIJIAN__hatch45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-GONGCHA-PEIJIAN__hatch135" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-GONGCHA-PEIJIAN__hatch45d" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-GONGCHA-PEIJIAN__hatch_solid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f2937" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-GONGCHA-PEIJIAN__hatch_blue" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
