<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 979 589" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG-LINETYPE-t FIG-LINETYPE-d" class="fig-svg">
  <title id="FIG-LINETYPE-t">图线线型对照表：六种图线的线型、线宽与用途</title>
  <desc id="FIG-LINETYPE-d">粗实线、细实线、虚线、细点画线、波浪线、双点画线画在同一张图上对照；线宽以粗实线 d 为基准，细线为 d/2。</desc>
  <defs>
  <pattern id="FIG-LINETYPE__hatch45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-LINETYPE__hatch135" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-LINETYPE__hatch45d" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-LINETYPE__hatch_solid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f2937" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-LINETYPE__hatch_blue" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#2563eb" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#2563eb" stroke-width="1"/>
  </pattern>
  <pattern id="FIG-LINETYPE__hatch_orange" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="6" height="6" fill="#ea580c" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#ea580c" stroke-width="1"/>
  </pattern>
  <marker id="FIG-LINETYPE__ar-ink" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="currentColor"/></marker>
  <marker id="FIG-LINETYPE__ar-blue" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#2563eb"/></marker>
  <marker id="FIG-LINETYPE__ar-red" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#dc2626"/></marker>
  <marker id="FIG-LINETYPE__ar-green" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#16a34a"/></marker>
  <marker id="FIG-LINETYPE__ar-orange" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#ea580c"/></marker>
  <marker id="FIG-LINETYPE__ar-amber" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#b45309"/></marker>
  <marker id="FIG-LINETYPE__ar-violet" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#7c3aed"/></marker>
  <marker id="FIG-LINETYPE__ar-teal" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#0f766e"/></marker>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="40" y="32" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">图 1  图线线型对照表（GB/T 17450、GB/T 4457.4）</text>
    <text x="40" y="52" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">线宽关系：粗线 = d，细线 = d/2；本图取 d = 2 px（A3 图纸实际 d ≈ 0.7 mm）。</text>
    <text x="40" y="82" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">线型（样本）</text>
    <text x="320" y="82" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">线宽</text>
    <text x="400" y="82" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">名称</text>
    <text x="520" y="82" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">用途 —— 画什么线</text>
    <line x1="40" y1="118" x2="290" y2="118" stroke="currentColor" stroke-width="2"/>
    <text x="320" y="122" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">粗 d</text>
    <text x="400" y="122" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">粗实线</text>
    <text x="520" y="122" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">可见轮廓线、可见过渡线；螺纹牙顶圆</text>
    <line x1="40" y1="182" x2="290" y2="182" stroke="currentColor" stroke-width="0.8"/>
    <text x="320" y="186" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">细 d/2</text>
    <text x="400" y="186" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">细实线</text>
    <text x="520" y="186" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">尺寸线、尺寸界线、剖面线、螺纹牙底圆、引出线</text>
    <line x1="40" y1="246" x2="290" y2="246" stroke="currentColor" stroke-width="0.8" stroke-dasharray="6 4"/>
    <text x="320" y="250" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">细 d/2</text>
    <text x="400" y="250" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">虚线</text>
    <text x="520" y="250" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">不可见轮廓线、不可见过渡线（尽量少用，能用剖视就不用虚线）</text>
    <line x1="40" y1="310" x2="290" y2="310" stroke="currentColor" stroke-width="0.8" stroke-dasharray="18 4 3 4"/>
    <text x="320" y="314" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">细 d/2</text>
    <text x="400" y="314" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">细点画线</text>
    <text x="520" y="314" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">轴线、对称中心线、圆的中心线</text>
    <path d="M40,374 L42,376.56 L44,377.53 L46,376.23 L48,373.46 L50,371.03 L52,370.51 L54,372.2 L56,374.99 L58,377.06 L60,377.15 L62,375.31 L64,372.79 L66,371.19 L68,371.39 L70,373.11 L72,375.17 L74,376.31 L76,375.99 L78,374.6 L80,373.03 L82,371.89 L84,371.92 L86,373.27 L88,375.25 L90,376.69 L92,376.66 L94,375.04 L96,372.68 L98,370.93 L100,370.84 L102,372.54 L104,375.12 L106,377.15 L108,377.47 L110,375.91 L112,373.31 L114,371.12 L116,370.51 L118,371.77 L120,374.15 L122,376.34 L124,377.17 L126,376.3 L128,374.31 L130,372.34 L132,371.42 L134,371.92 L136,373.43 L138,375.04 L140,375.89 L142,375.94 L144,374.83 L146,373.05 L148,371.58 L150,371.38 L152,372.72 L154,374.96 L156,376.82 L158,377.14 L160,375.61 L162,373.02 L164,370.91 L166,370.58 L168,372.3 L170,375.06 L172,377.2 L174,377.38 L176,375.52 L178,372.78 L180,370.88 L182,370.96 L184,372.88 L186,375.36 L188,376.83 L190,376.45 L192,374.62 L194,372.61 L196,371.68 L198,372.27 L200,373.82 L202,375.41 L204,376.27 L206,375.68 L208,373.84 L210,371.88 L212,371.13 L214,372.26 L216,374.65 L218,376.79 L220,377.23 L222,375.59 L224,372.85 L226,370.76 L228,370.68 L230,372.68 L232,375.5 L234,377.38 L236,377.17 L238,375.06 L240,372.4 L242,370.81 L244,371.16 L246,373.12 L248,375.43 L250,376.74 L252,376.4 L254,374.78 L256,372.93 L258,371.89 L260,372.12 L262,373.24 L264,374.84 L266,376.18 L268,376.41 L270,375.25 L272,373.23 L274,371.44 L276,370.95 L278,372.14 L280,374.45 L282,376.64 L284,377.48 L286,376.44 L288,374.05 L290,371.6" stroke="currentColor" stroke-width="0.8" fill="none"/>
    <text x="320" y="378" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">细 d/2</text>
    <text x="400" y="378" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">波浪线</text>
    <text x="520" y="378" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">断裂边界线、局部剖视图的分界线</text>
    <line x1="40" y1="438" x2="290" y2="438" stroke="currentColor" stroke-width="0.8" stroke-dasharray="20 4 3 4 3 4"/>
    <text x="320" y="442" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">细 d/2</text>
    <text x="400" y="442" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">双点画线</text>
    <text x="520" y="442" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">相邻辅助零件的轮廓、可动零件的极限位置、中断线</text>
    <line x1="40" y1="468" x2="960" y2="468" stroke="currentColor" stroke-width="0.8"/>
    <text x="40" y="498" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 同一图样中同类图线的宽度应一致；虚线、点画线的线段长度与间隔应大致相等。</text>
    <text x="40" y="521" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 点画线的首末两端应画成线段而不是点，并超出轮廓线 2～5 mm（图上约 4 px）。</text>
    <text x="40" y="544" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 虚线、点画线与实线重合时按实线画；虚线在实线的延长线上时应留出空隙。</text>
    <text x="40" y="567" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">④ 波浪线、双折线都表示断裂边界：手绘用波浪线、CAD 用双折线；波浪线不得与轮廓线重合。</text>
  </g>
</svg>
