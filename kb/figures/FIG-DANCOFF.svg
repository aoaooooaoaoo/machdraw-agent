<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-DANCOFF-t FIG-DANCOFF-d"><title id="FIG-DANCOFF-t">图 5-3  丹可夫效应：栅格几何对有效共振积分的影响</title><desc id="FIG-DANCOFF-d">相邻燃料棒互相“遮蔽”：栅距越小，进入本棒的中子越少，自屏越强、I_eff 越低；孤立棒时丹可夫因子 C→0</desc><defs><marker id="FIG-DANCOFF_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-DANCOFF_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-DANCOFF_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-DANCOFF_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-DANCOFF_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-DANCOFF_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-DANCOFF_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-DANCOFF_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-DANCOFF_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 5-3  丹可夫效应：栅格几何对有效共振积分的影响</text><text x="40" y="66" font-size="15" fill="#7a8288">相邻燃料棒互相“遮蔽”：栅距越小，进入本棒的中子越少，自屏越强、I_eff 越低；孤立棒时丹可夫因子 C→0</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><text x="40" y="116" font-size="16" font-weight="600" fill="#1f2328">① 同一棒径、三种栅距（俯视）</text><rect x="103.5" y="183.6" width="52.9" height="52.9" rx="0" stroke="#e3e0da" fill="#f4f8fc" stroke-width="1"/><circle cx="130" cy="210" r="20" stroke="#1f2328" fill="#e8e4da" stroke-width="1.6"/><circle cx="130" cy="210" r="11" stroke="#b45309" fill="#f0dcc0" stroke-width="1.2"/><text x="130" y="214" font-size="10" text-anchor="middle" fill="#1f2328">UO₂</text><text x="130" y="254.4" font-size="12" text-anchor="middle" fill="#7a8288">栅距小</text><line x1="156" y1="184" x2="178" y2="170" stroke="#c0392b" stroke-width="1.4" marker-end="url(#FIG-DANCOFF_ar_red)"/><text x="160" y="164" font-size="11" fill="#c0392b">被邻居吸收</text><rect x="233.2" y="173.2" width="73.6" height="73.6" rx="0" stroke="#e3e0da" fill="#f4f8fc" stroke-width="1"/><circle cx="270" cy="210" r="20" stroke="#1f2328" fill="#e8e4da" stroke-width="1.6"/><circle cx="270" cy="210" r="11" stroke="#b45309" fill="#f0dcc0" stroke-width="1.2"/><text x="270" y="214" font-size="10" text-anchor="middle" fill="#1f2328">UO₂</text><text x="270" y="264.8" font-size="12" text-anchor="middle" fill="#7a8288">栅距中</text><line x1="296" y1="184" x2="318" y2="170" stroke="#c0392b" stroke-width="1.4" marker-end="url(#FIG-DANCOFF_ar_red)"/><text x="300" y="164" font-size="11" fill="#c0392b">被邻居吸收</text><rect x="350.2" y="150.2" width="119.6" height="119.6" rx="0" stroke="#e3e0da" fill="#f4f8fc" stroke-width="1"/><circle cx="410" cy="210" r="20" stroke="#1f2328" fill="#e8e4da" stroke-width="1.6"/><circle cx="410" cy="210" r="11" stroke="#b45309" fill="#f0dcc0" stroke-width="1.2"/><text x="410" y="214" font-size="10" text-anchor="middle" fill="#1f2328">UO₂</text><text x="410" y="287.8" font-size="12" text-anchor="middle" fill="#7a8288">栅距大（近孤立棒）</text><text x="40" y="300" font-size="13" fill="#7a8288">细线方框 = 一个栅元；灰色环 = 燃料棒；红色箭头 = 本可逃出的共振中子被相邻棒吸收</text><text x="470" y="116" font-size="16" font-weight="600" fill="#1f2328">② 有效共振积分随栅距 / 棒径变化</text><line x1="526" y1="330" x2="890" y2="330" stroke="#1f2328" stroke-width="1.4"/><line x1="526" y1="330" x2="526" y2="146" stroke="#1f2328" stroke-width="1.4"/><line x1="872" y1="330" x2="890" y2="330" stroke="#1f2328" stroke-width="1.4" marker-end="url(#FIG-DANCOFF_ar_ink)"/><line x1="526" y1="164" x2="526" y2="146" stroke="#1f2328" stroke-width="1.4" marker-end="url(#FIG-DANCOFF_ar_ink)"/><line x1="521" y1="330" x2="526" y2="330" stroke="#1f2328" stroke-width="1.2"/><text x="514" y="335" font-size="14" text-anchor="end" fill="#1f2328">0</text><line x1="521" y1="250" x2="526" y2="250" stroke="#1f2328" stroke-width="1.2"/><text x="514" y="255" font-size="14" text-anchor="end" fill="#1f2328">0.5</text><line x1="521" y1="170" x2="526" y2="170" stroke="#1f2328" stroke-width="1.2"/><text x="514" y="175" font-size="14" text-anchor="end" fill="#1f2328">1</text><line x1="526" y1="330" x2="526" y2="335" stroke="#1f2328" stroke-width="1.2"/><text x="526" y="351" font-size="14" text-anchor="middle" fill="#1f2328">1</text><line x1="578" y1="330" x2="578" y2="335" stroke="#1f2328" stroke-width="1.2"/><text x="578" y="351" font-size="14" text-anchor="middle" fill="#1f2328">2</text><line x1="630" y1="330" x2="630" y2="335" stroke="#1f2328" stroke-width="1.2"/><text x="630" y="351" font-size="14" text-anchor="middle" fill="#1f2328">3</text><line x1="682" y1="330" x2="682" y2="335" stroke="#1f2328" stroke-width="1.2"/><text x="682" y="351" font-size="14" text-anchor="middle" fill="#1f2328">4</text><line x1="786" y1="330" x2="786" y2="335" stroke="#1f2328" stroke-width="1.2"/><text x="786" y="351" font-size="14" text-anchor="middle" fill="#1f2328">6</text><line x1="890" y1="330" x2="890" y2="335" stroke="#1f2328" stroke-width="1.2"/><text x="890" y="351" font-size="14" text-anchor="middle" fill="#1f2328">8</text><text x="708" y="368" font-size="15" text-anchor="middle" fill="#1f2328">栅距与棒径之比 P/D（慢化剂相对量）</text><text x="474" y="238" font-size="15" text-anchor="middle" fill="#1f2328" transform="rotate(-90 474 238)">I_eff / I_孤立棒</text><path d="M527,267.5 L528.9,264.6 L530.7,261.7 L532.5,259 L534.3,256.3 L536.2,253.7 L538,251.2 L539.8,248.7 L541.6,246.4 L543.5,244.1 L545.3,241.9 L547.1,239.7 L548.9,237.6 L550.8,235.6 L552.6,233.6 L554.4,231.7 L556.2,229.8 L558,228 L559.9,226.3 L561.7,224.6 L563.5,223 L565.3,221.4 L567.2,219.8 L569,218.3 L570.8,216.9 L572.6,215.5 L574.5,214.1 L576.3,212.8 L578.1,211.5 L579.9,210.3 L581.8,209 L583.6,207.9 L585.4,206.7 L587.2,205.6 L589.1,204.6 L590.9,203.5 L592.7,202.5 L594.5,201.5 L596.3,200.6 L598.2,199.7 L600,198.8 L601.8,197.9 L603.6,197.1 L605.5,196.3 L607.3,195.5 L609.1,194.7 L610.9,194 L612.8,193.2 L614.6,192.5 L616.4,191.9 L618.2,191.2 L620.1,190.6 L621.9,190 L623.7,189.4 L625.5,188.8 L627.4,188.2 L629.2,187.7 L631,187.1 L632.8,186.6 L634.7,186.1 L636.5,185.6 L638.3,185.2 L640.1,184.7 L641.9,184.3 L643.8,183.8 L645.6,183.4 L647.4,183 L649.2,182.6 L651.1,182.3 L652.9,181.9 L654.7,181.5 L656.5,181.2 L658.4,180.8 L660.2,180.5 L662,180.2 L663.8,179.9 L665.7,179.6 L667.5,179.3 L669.3,179 L671.1,178.8 L673,178.5 L674.8,178.2 L676.6,178 L678.4,177.8 L680.2,177.5 L682.1,177.3 L683.9,177.1 L685.7,176.9 L687.5,176.7 L689.4,176.5 L691.2,176.3 L693,176.1 L694.8,175.9 L696.7,175.7 L698.5,175.5 L700.3,175.4 L702.1,175.2 L704,175.1 L705.8,174.9 L707.6,174.8 L709.4,174.6 L711.3,174.5 L713.1,174.3 L714.9,174.2 L716.7,174.1 L718.6,174 L720.4,173.8 L722.2,173.7 L724,173.6 L725.8,173.5 L727.7,173.4 L729.5,173.3 L731.3,173.2 L733.1,173.1 L735,173 L736.8,172.9 L738.6,172.8 L740.4,172.7 L742.3,172.7 L744.1,172.6 L745.9,172.5 L747.7,172.4 L749.6,172.4 L751.4,172.3 L753.2,172.2 L755,172.2 L756.9,172.1 L758.7,172 L760.5,172 L762.3,171.9 L764.1,171.8 L766,171.8 L767.8,171.7 L769.6,171.7 L771.4,171.6 L773.3,171.6 L775.1,171.5 L776.9,171.5 L778.7,171.4 L780.6,171.4 L782.4,171.4 L784.2,171.3 L786,171.3 L787.9,171.2 L789.7,171.2 L791.5,171.2 L793.3,171.1 L795.2,171.1 L797,171.1 L798.8,171 L800.6,171 L802.5,171 L804.3,170.9 L806.1,170.9 L807.9,170.9 L809.7,170.9 L811.6,170.8 L813.4,170.8 L815.2,170.8 L817,170.8 L818.9,170.7 L820.7,170.7 L822.5,170.7 L824.3,170.7 L826.2,170.7 L828,170.6 L829.8,170.6 L831.6,170.6 L833.5,170.6 L835.3,170.6 L837.1,170.5 L838.9,170.5 L840.8,170.5 L842.6,170.5 L844.4,170.5 L846.2,170.5 L848,170.5 L849.9,170.4 L851.7,170.4 L853.5,170.4 L855.3,170.4 L857.2,170.4 L859,170.4 L860.8,170.4 L862.6,170.4 L864.5,170.3 L866.3,170.3 L868.1,170.3 L869.9,170.3 L871.8,170.3 L873.6,170.3 L875.4,170.3 L877.2,170.3 L879.1,170.3 L880.9,170.3 L882.7,170.3 L884.5,170.2 L886.4,170.2 L888.2,170.2 L890,170.2" stroke="#2f6fb0" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="526" y1="170" x2="890" y2="170" stroke="#7a8288" stroke-width="1" stroke-dasharray="5 4"/><text x="650.8" y="158" font-size="12" fill="#7a8288">孤立棒极限：I_eff → I∞</text><circle cx="539.5" cy="249.1" r="3.6" stroke="#c0392b" fill="#c0392b" stroke-width="1"/><text x="545.5" y="237.1" font-size="12" fill="#c0392b">压水堆栅格 P/D≈1.26</text><text x="560" y="300" font-size="13" fill="#1f2328">栅格越密 → 丹可夫效应越强 → 自屏越强 → I_eff 越低</text><text x="40" y="372" font-size="16" font-weight="600" fill="#1f2328">③ 丹可夫效应对四因子的影响（非均匀 vs 均匀）</text><text x="48" y="398" font-size="14" fill="#1f2328">逃脱共振俘获概率 p</text><text x="250" y="398" font-size="15" font-weight="600" fill="#2e7d4f">↑ 增大</text><text x="330" y="398" font-size="13" fill="#7a8288">共振中子被邻居棒“挡”在外面，²³⁸U 总吸收减少</text><text x="48" y="424" font-size="14" fill="#1f2328">快中子倍增系数 ε</text><text x="250" y="424" font-size="15" font-weight="600" fill="#2f6fb0">↑ 略增</text><text x="330" y="424" font-size="13" fill="#7a8288">裂变中子在燃料内产生，²³⁸U 快裂变增多</text><text x="48" y="450" font-size="14" fill="#1f2328">热中子利用系数 f</text><text x="250" y="450" font-size="15" font-weight="600" fill="#c0392b">↓ 减小</text><text x="330" y="450" font-size="13" fill="#7a8288">热中子在慢化剂中产生，被慢化剂吸收的份额增加</text><text x="48" y="476" font-size="14" fill="#1f2328">综合 k∞</text><text x="250" y="476" font-size="15" font-weight="600" fill="#0f766e">通常 ↑</text><text x="330" y="476" font-size="13" fill="#7a8288">p 的增加大于 f 的减小 → 非均匀栅格更省燃料</text><rect x="40" y="512" width="880" height="52" rx="8" stroke="#b45309" fill="#fbf4ea" stroke-width="1.2"/><text x="56" y="534" font-size="14" fill="#b45309">结论：非均匀栅格把燃料集中成棒、慢化剂分开，既利用了自屏减小共振吸收，又牺牲一点热中子利用——综合效果更好。</text><text x="56" y="554" font-size="14" fill="#1f2328">这正是压水堆采用“棒状燃料 + 水栅格”而不是“铀水均匀混合”的物理原因。</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第5章 5.3.2 节 p.86~88、5.5.1 节 p.91 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">丹可夫因子 C 表示从棒表面逃出的共振中子中又被相邻棒吸收的份额；1−C 才是真正逃脱的份额</text></g></svg>
