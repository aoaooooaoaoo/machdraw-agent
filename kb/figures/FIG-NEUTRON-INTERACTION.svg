<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-NEUTRON-INTERACTION-t FIG-NEUTRON-INTERACTION-d"><title id="FIG-NEUTRON-INTERACTION-t">图 2-1  中子与原子核相互作用的三种结果</title><desc id="FIG-NEUTRON-INTERACTION-d">散射（n,n）改变中子能量与方向；吸收（n,γ）使中子消失；裂变（n,f）产生 2~3 个新中子</desc><defs><marker id="FIG-NEUTRON-INTERACTION_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-NEUTRON-INTERACTION_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-NEUTRON-INTERACTION_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-NEUTRON-INTERACTION_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-NEUTRON-INTERACTION_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-NEUTRON-INTERACTION_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-NEUTRON-INTERACTION_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-NEUTRON-INTERACTION_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-NEUTRON-INTERACTION_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 2-1  中子与原子核相互作用的三种结果</text><text x="40" y="66" font-size="15" fill="#7a8288">散射（n,n）改变中子能量与方向；吸收（n,γ）使中子消失；裂变（n,f）产生 2~3 个新中子</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><rect x="40" y="104" width="300" height="330" rx="10" stroke="#2f6fb0" fill="#ffffff" stroke-width="1.6"/><rect x="50" y="112" width="75.2" height="25" rx="5" stroke="#2f6fb0" fill="#2f6fb0" stroke-width="1.1"/><text x="87.6" y="129" font-size="15" text-anchor="middle" font-weight="600" fill="#ffffff">A  散射</text><rect x="330" y="104" width="300" height="330" rx="10" stroke="#0f766e" fill="#ffffff" stroke-width="1.6"/><rect x="340" y="112" width="75.2" height="25" rx="5" stroke="#0f766e" fill="#0f766e" stroke-width="1.1"/><text x="377.6" y="129" font-size="15" text-anchor="middle" font-weight="600" fill="#ffffff">B  吸收</text><rect x="620" y="104" width="300" height="330" rx="10" stroke="#c0392b" fill="#ffffff" stroke-width="1.6"/><rect x="630" y="112" width="75.2" height="25" rx="5" stroke="#c0392b" fill="#c0392b" stroke-width="1.1"/><text x="667.6" y="129" font-size="15" text-anchor="middle" font-weight="600" fill="#ffffff">C  裂变</text><circle cx="92" cy="210" r="12" stroke="#1f2328" fill="#e8f0fa" stroke-width="1.4"/><text x="92" y="215" font-size="14" text-anchor="middle" fill="#1f2328">n</text><line x1="108" y1="210" x2="168" y2="210" stroke="#2f6fb0" stroke-width="2.2" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_blue)"/><text x="110" y="200" font-size="13" fill="#2f6fb0">E₀</text><circle cx="220" cy="210" r="30" stroke="#1f2328" fill="#f3efe6" stroke-width="1.6"/><text x="220" y="216" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">ᴬX</text><line x1="208" y1="236" x2="160" y2="300" stroke="#2f6fb0" stroke-width="2" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_blue)"/><text x="152" y="314" font-size="13" fill="#2f6fb0">n (E₁&lt;E₀)</text><line x1="240" y1="236" x2="286" y2="296" stroke="#1f2328" stroke-width="2" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_ink)"/><text x="290" y="306" font-size="13" fill="#1f2328">反冲核</text><text x="190" y="356" font-size="13" text-anchor="middle" fill="#7a8288">散射：中子没被吸收，但能量降低、方向改变</text><circle cx="374" cy="210" r="12" stroke="#1f2328" fill="#e8f0fa" stroke-width="1.4"/><text x="374" y="215" font-size="14" text-anchor="middle" fill="#1f2328">n</text><line x1="388" y1="210" x2="440" y2="210" stroke="#0f766e" stroke-width="2.2" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_teal)"/><circle cx="488" cy="210" r="30" stroke="#0f766e" fill="#e6f2ef" stroke-width="1.8"/><text x="488" y="208" font-size="13" text-anchor="middle" fill="#0f766e">复合核</text><text x="488" y="224" font-size="13" text-anchor="middle" fill="#0f766e">(ᵃ⁺¹X)*</text><line x1="488" y1="176" x2="488" y2="132" stroke="#0f766e" stroke-width="1.8" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_teal)"/><line x1="517.6" y1="227" x2="555.9" y2="249" stroke="#0f766e" stroke-width="1.8" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_teal)"/><line x1="458.4" y1="227" x2="420.1" y2="249" stroke="#0f766e" stroke-width="1.8" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_teal)"/><text x="488" y="132" font-size="15" text-anchor="middle" font-weight="600" fill="#0f766e">γ</text><text x="480" y="356" font-size="13" text-anchor="middle" fill="#7a8288">吸收：中子消失，能量以 γ 射线/带电粒子放出</text><circle cx="660" cy="210" r="11" stroke="#1f2328" fill="#e8f0fa" stroke-width="1.4"/><text x="660" y="215" font-size="14" text-anchor="middle" fill="#1f2328">n</text><line x1="674" y1="210" x2="724" y2="210" stroke="#c0392b" stroke-width="2.2" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_red)"/><circle cx="770" cy="210" r="26" stroke="#c0392b" fill="#fbeae8" stroke-width="1.8"/><text x="770" y="216" font-size="13" text-anchor="middle" fill="#c0392b">(²³⁶U)*</text><line x1="798" y1="196" x2="866" y2="158" stroke="#c0392b" stroke-width="2.4" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_red)"/><line x1="798" y1="226" x2="866" y2="262" stroke="#c0392b" stroke-width="2.4" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_red)"/><text x="828" y="148" font-size="13" fill="#c0392b">碎片 1（A≈95）</text><text x="828" y="282" font-size="13" fill="#c0392b">碎片 2（A≈139）</text><line x1="770" y1="184" x2="770" y2="140" stroke="#2f6fb0" stroke-width="1.6" marker-end="url(#FIG-NEUTRON-INTERACTION_ar_blue)"/><text x="776" y="138" font-size="13" fill="#2f6fb0">2~3 个快中子</text><text x="770" y="356" font-size="13" text-anchor="middle" fill="#7a8288">裂变：每次约放出 200 MeV，是反应堆的能量来源</text><text x="40" y="470" font-size="16" font-weight="600" fill="#1f2328">反应道与截面符号</text><text x="48" y="492" font-size="14" fill="#7a8288">总截面</text><text x="148" y="492" font-size="15" font-weight="600" fill="#1f2328">σ_t = σ_s + σ_a</text><text x="390" y="492" font-size="14" fill="#7a8288">任何一次作用都计入</text><text x="48" y="514" font-size="14" fill="#7a8288">散射截面</text><text x="148" y="514" font-size="15" font-weight="600" fill="#1f2328">σ_s = σ_e + σ_in</text><text x="390" y="514" font-size="14" fill="#7a8288">弹性 σ_e + 非弹性 σ_in</text><text x="48" y="536" font-size="14" fill="#7a8288">吸收截面</text><text x="148" y="536" font-size="15" font-weight="600" fill="#1f2328">σ_a = σ_γ + σ_f</text><text x="390" y="536" font-size="14" fill="#7a8288">俘获 σ_γ + 裂变 σ_f</text><text x="48" y="558" font-size="14" fill="#7a8288">宏观截面</text><text x="148" y="558" font-size="15" font-weight="600" fill="#1f2328">Σ = Nσ（单位 cm⁻¹）</text><text x="390" y="558" font-size="14" fill="#7a8288">N 为靶核数密度</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第2章 2.1 节 p.10~13 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">截面符号：σs 散射、σγ 辐射俘获、σf 裂变、σa=σγ+σf</text></g></svg>
