<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="PAIR-DIYIJIAO-DISANJIAO-t PAIR-DIYIJIAO-DISANJIAO-d" class="fig-svg pair-svg" data-pair-id="PAIR-DIYIJIAO-DISANJIAO">
  <title id="PAIR-DIYIJIAO-DISANJIAO-t">第一角画法 与 第三角画法</title>
  <desc id="PAIR-DIYIJIAO-DISANJIAO-d">同一个台阶块、同样三个视图：只差视图摆在主视图的哪一侧 | A：第一角画法（我国采用）；B：第三角画法（欧美部分国家）</desc>
