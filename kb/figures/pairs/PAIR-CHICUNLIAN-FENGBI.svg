  <g data-legend="1">
    <text x="20" y="340" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="1">① 总长尺寸：A 注出 120，与 30+40+50 首尾相接；B 不注总长，把它留作开口环</text>
    <text x="20" y="360" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="2">② 尺寸链状态：A 封闭 → 各尺寸公差互相挤压，加工检验必出矛盾；B 开口 → 各段独立</text>
    <text x="20" y="380" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="3">③ 开口环怎么选：留下的应是最次要、自然形成的尺寸（此例为总长），不能删关键装配尺寸</text>
    <text x="20" y="400" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280" data-diff="0">注：同一方向的尺寸链只允许留一个开口环；总体尺寸与各段尺寸不要同时注出</text>
  </g>
