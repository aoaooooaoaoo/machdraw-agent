<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" role="img" aria-labelledby="PAIR-DIFF-TRANSPORT-t PAIR-DIFF-TRANSPORT-d" class="fig-svg pair-svg" data-pair-id="PAIR-DIFF-TRANSPORT">
<title id="PAIR-DIFF-TRANSPORT-t">扩散理论 与 输运理论</title>
<desc id="PAIR-DIFF-TRANSPORT-d">A：扩散理论（Fick + 四假设，光滑通量）| B：输运理论（角通量，吸收体附近凹陷）</desc>
<defs>
<marker id="arInk" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.8,1 L8.6,5 L0.8,9 Z" fill="#1f2328"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.8,1 L8.6,5 L0.8,9 Z" fill="#2f6fb0"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.8,1 L8.6,5 L0.8,9 Z" fill="#b0642f"/></marker>
<marker id="arRed" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.8,1 L8.6,5 L0.8,9 Z" fill="#c0392b"/></marker>
<marker id="arGrey" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.8,1 L8.6,5 L0.8,9 Z" fill="#6b7280"/></marker>
</defs>
<g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="980" height="660" fill="#fbfaf7"/>
<text x="490" y="44" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="600">辨析 2　扩散理论 vs 输运理论</text>
<text x="490" y="70" font-size="15" fill="#6b7280" text-anchor="middle">同一块含强吸收体的板状介质：扩散把通量抹平，输运在吸收体附近挖出一个凹陷</text>
<line x1="30" y1="82" x2="950" y2="82" stroke="#e3e0da" stroke-width="1.2"/>
<line x1="30" y1="556" x2="950" y2="556" stroke="#e3e0da" stroke-width="1.2"/>
<text x="32" y="574" font-size="15" fill="#1f2328">① 描述量：A 只求标量通量 φ(r) 与净流 J = −D dφ/dx；B 求角通量 ψ(r, E, Ω)，保留方向 Ω</text>
<text x="32" y="594" font-size="15" fill="#1f2328">② 前提假设：A 需 Fick 的四条假设（无限均匀、散射各向同性、弱吸收、通量缓变）；B 无近似，方程由中子数守恒严格导出</text>
<text x="32" y="614" font-size="15" fill="#1f2328">③ 适用范围：A 外表面/强吸收体/源附近几 λtr 内误差大；B 强吸收体、真空边界、源附近都适用</text>
<text x="32" y="634" font-size="15" fill="#1f2328">④ 精度与代价：A 二阶椭圆方程，计算量小，工程精度可接受；B 七维（r, E, Ω, t）计算量大，多作基准校核</text>
<text x="948" y="651" font-size="15" fill="#6b7280" text-anchor="end">依据教材 第4章 p.65 自绘</text>
<rect x="24" y="96" width="452" height="456" fill="#f2f7fc" stroke="#e3e0da" stroke-width="1.2" rx="8"/>
<text x="250" y="126" font-size="20" fill="#2f6fb0" text-anchor="middle" font-weight="600">A：扩散理论（Diffusion）</text>
<rect x="504" y="96" width="452" height="456" fill="#fbf5ef" stroke="#e3e0da" stroke-width="1.2" rx="8"/>
<text x="730" y="126" font-size="20" fill="#b0642f" text-anchor="middle" font-weight="600">B：输运理论（Transport）</text>
