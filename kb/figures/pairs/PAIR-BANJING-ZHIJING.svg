    <text x="20" y="360" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="2">② 整圆用 Ø：A 通孔注 Ø16；B 注成 R8 —— 半径符号不能标整圆</text>
    <text x="20" y="380" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="3">③ 尺寸线：R 的尺寸线必须通过圆心、只画一个箭头指向圆弧；Ø 的尺寸线通过圆心、两端箭头指向圆周</text>
    <text x="20" y="400" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280" data-diff="0">注：口诀：整圆和大于半圆的弧注 Ø，半圆及小于半圆的弧注 R</text>
