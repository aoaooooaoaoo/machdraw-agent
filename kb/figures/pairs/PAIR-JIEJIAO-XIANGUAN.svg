  <g data-legend="1">
    <text x="20" y="340" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="1">① 交线来源不同：A 是平面与曲面相交（截交线）；B 是两曲面相交（相贯线）</text>
    <text x="20" y="360" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="2">② 交线形状不同：A 一定是平面图形（垂直轴→圆、倾斜→椭圆、平行轴→矩形）；B 一般是空间曲线</text>
    <text x="20" y="380" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="3">③ 求法不同：A 求截平面与素线的交点；B 求两曲面共有点（积聚性取点 / 辅助平面法）</text>
    <text x="20" y="400" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280" data-diff="0">注：两种交线都用粗实线画；相贯线总是向大直径回转体的轴线方向弯曲</text>
