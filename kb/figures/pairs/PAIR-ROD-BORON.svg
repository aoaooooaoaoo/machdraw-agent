<circle cx="34" cy="515" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="34" y="519.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">③</text>
<text x="50" y="520" font-size="15" fill="#1f2328">副作用：通量畸变、棒间干涉（总值 7000 pcm）</text>
<circle cx="34" cy="535" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="34" y="539.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">④</text>
<text x="50" y="540" font-size="15" fill="#1f2328">分工：棒管秒级快变化，硼管小时级慢变化</text>
