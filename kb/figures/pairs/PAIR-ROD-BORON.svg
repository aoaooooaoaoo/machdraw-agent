<g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="980" height="660" fill="#fbfaf7"/>
<text x="490" y="44" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="600">辨析 7　控制棒 vs 可溶硼</text>
<text x="490" y="70" font-size="15" fill="#6b7280" text-anchor="middle">两种反应性控制手段：棒靠局部强吸收、动作以秒计；硼靠均匀溶解、动作以小时计</text>
<line x1="30" y1="82" x2="950" y2="82" stroke="#e3e0da" stroke-width="1.2"/>
<line x1="30" y1="556" x2="950" y2="556" stroke="#e3e0da" stroke-width="1.2"/>
<text x="32" y="574" font-size="15" fill="#1f2328">① 空间分布：A 局部强吸收体，价值 ∝ φ²，扰动功率分布；B 溶于冷却剂，空间均匀，不扰动功率分布</text>
<text x="32" y="594" font-size="15" fill="#1f2328">② 价值曲线：A 微分价值中部最大（钟形），积分价值 S 形；B 硼微分价值随浓度缓变，近似线性</text>
<text x="32" y="614" font-size="15" fill="#1f2328">③ 响应速度：A 机械抽插，秒级，可快速调节与停堆；B 硼化/稀释靠化容系统，小时级，只能慢变化</text>
<text x="32" y="634" font-size="15" fill="#1f2328">④ 用途分工：A 快速调节 + 停堆，总价值约 7000 pcm；B 补偿燃耗/温度/氙，总价值约 17000 pcm（份额最大）</text>
<text x="948" y="651" font-size="15" fill="#6b7280" text-anchor="end">依据教材 第7章 p.121–127 自绘</text>
<rect x="24" y="96" width="452" height="456" fill="#f2f7fc" stroke="#e3e0da" stroke-width="1.2" rx="8"/>
<text x="250" y="126" font-size="20" fill="#2f6fb0" text-anchor="middle" font-weight="600">A：控制棒（Control rod）</text>
