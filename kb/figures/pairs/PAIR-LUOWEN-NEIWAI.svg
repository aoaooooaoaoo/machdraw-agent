  <g data-legend="1">
    <text x="20" y="340" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="1">① 牙顶线型不同：A 外螺纹的牙顶在大径 d 上，画粗实线；B 内螺纹的牙顶在小径 D₁ 上，画粗实线</text>
    <text x="20" y="360" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="2">② 牙底线型不同：A 牙底（小径 d₁≈0.85d）画细实线；B 牙底（大径 D）画细实线 —— 两图粗细线正好互换</text>
    <text x="20" y="380" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="3">③ 剖面线：A 是实心杆，不剖、无剖面线；B 剖面线画到牙顶粗实线为止，不越过牙底细实线</text>
    <text x="20" y="400" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280" data-diff="0">注：端视图：外螺纹大径整圆粗实线、小径约 3/4 圈细实线；内螺纹相反（小径粗、大径细 3/4 圈）</text>
  </g>
  </g>
