<text x="104" y="344" font-size="15" fill="#2f6fb0" font-weight="600">单群：一条余弦，B² 唯一</text>
<circle cx="34" cy="451" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="34" y="455.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">①</text>
<text x="50" y="456" font-size="15" fill="#1f2328">群常数：全谱一个平均截面</text>
<circle cx="34" cy="471" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="34" y="475.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">②</text>
<text x="50" y="476" font-size="15" fill="#1f2328">临界：k_eff = k∞/(1+M²B²)，M² = L²+τ</text>
<circle cx="34" cy="491" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="34" y="495.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">③</text>
<text x="50" y="496" font-size="15" fill="#1f2328">精度：热堆误差可达百分之几到十几</text>
