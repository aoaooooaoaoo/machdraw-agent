  <g data-legend="1">
    <text x="20" y="340" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="1">① 图形内容不同：A 只画断面形状（圆 + 肋）；B 还要画出剖切面后方可见的底板轮廓</text>
    <text x="20" y="360" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="2">② 底板轮廓的画法：A 没有；B 用粗实线画，但绝不能画剖面线</text>
    <text x="20" y="380" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="3">③ 剖面线的范围：两图都只画在被切到的断面内（圆与肋），肋板横向剖切必须画</text>
    <text x="20" y="400" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280" data-diff="0">注：断面图轮廓用粗实线；不对称的移出断面必须标箭头，在剖切符号延长线上的对称断面可省略全部标注</text>
  </g>
