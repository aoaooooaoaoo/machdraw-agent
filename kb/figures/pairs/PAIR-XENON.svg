<text x="490" y="44" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="600">辨析 5　氙平衡 vs 停堆碘坑</text>
<text x="490" y="70" font-size="15" fill="#6b7280" text-anchor="middle">同一条 135I → 135Xe 燃耗链的两种时间行为：建平衡靠 2 天，碘坑出现在停堆后 10 h</text>
<line x1="30" y1="82" x2="950" y2="82" stroke="#e3e0da" stroke-width="1.2"/>
<line x1="30" y1="556" x2="950" y2="556" stroke="#e3e0da" stroke-width="1.2"/>
<text x="32" y="574" font-size="15" fill="#1f2328">① 工况：A 功率恒定，碘氙从零建立平衡；B 满功率运行后突然停堆，φ → 0</text>
<text x="32" y="594" font-size="15" fill="#1f2328">② 浓度曲线：A 碘、氙单调上升到平衡（约 2 天）；B 氙先升到约 2 倍再按 9.2 h 衰变</text>
<text x="32" y="614" font-size="15" fill="#1f2328">③ 工程含义：A 决定平衡氙中毒与寿期初临界硼浓度；B 决定停堆后再启动窗口与强迫停堆时间</text>
<text x="948" y="651" font-size="15" fill="#6b7280" text-anchor="end">依据教材 第6章 p.101–105 自绘</text>
