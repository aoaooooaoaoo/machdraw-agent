<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" role="img" aria-labelledby="PAIR-TEMPCOEF-t PAIR-TEMPCOEF-d" class="fig-svg pair-svg" data-pair-id="PAIR-TEMPCOEF">
<title id="PAIR-TEMPCOEF-t">负温度系数 与 正温度系数</title>
<desc id="PAIR-TEMPCOEF-d">A：负温度系数（自稳）| B：正温度系数（发散）</desc>
