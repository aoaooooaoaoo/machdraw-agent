<g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="980" height="660" fill="#fbfaf7"/>
<text x="490" y="44" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="600">辨析 3　负温度系数 vs 正温度系数</text>
<text x="490" y="70" font-size="15" fill="#6b7280" text-anchor="middle">在同一 10 ℃ 升温扰动下：负反馈把功率拉回并稳住，正反馈把功率推离平衡</text>
<line x1="30" y1="82" x2="950" y2="82" stroke="#e3e0da" stroke-width="1.2"/>
<line x1="30" y1="556" x2="950" y2="556" stroke="#e3e0da" stroke-width="1.2"/>
<text x="32" y="574" font-size="15" fill="#1f2328">① 反馈方向：A 温度↑ → ρ 下降 → 功率自动回落；B 温度↑ → ρ 上升 → 功率持续上升</text>
<text x="32" y="594" font-size="15" fill="#1f2328">② 稳定性：A 负反馈自稳，扰动后收敛到新平衡；B 正反馈发散，只能靠保护系统或人工降功率</text>
<text x="32" y="614" font-size="15" fill="#1f2328">③ 物理机理：A 多普勒展宽使 238U 共振吸收增加（瞬发）；慢化剂密度下降使 p 下降；B 过慢化/高硼时慢化剂密度下降使 f 增大占优</text>
<text x="948" y="651" font-size="15" fill="#6b7280" text-anchor="end">依据教材 第7章 p.116–118 自绘</text>
<rect x="24" y="96" width="452" height="456" fill="#f2f7fc" stroke="#e3e0da" stroke-width="1.2" rx="8"/>
<text x="250" y="126" font-size="20" fill="#2f6fb0" text-anchor="middle" font-weight="600">A：负温度系数 α_T &lt; 0（自稳）</text>
