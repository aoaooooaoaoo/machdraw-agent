<g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="980" height="660" fill="#fbfaf7"/>
<text x="490" y="44" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="600">辨析 4　有反射层 vs 无反射层（裸堆）</text>
<text x="490" y="70" font-size="15" fill="#6b7280" text-anchor="middle">同功率下的径向通量：反射层把逸出中子送回来，边缘通量抬高、堆芯可以更小</text>
<line x1="30" y1="82" x2="950" y2="82" stroke="#e3e0da" stroke-width="1.2"/>
<line x1="30" y1="556" x2="950" y2="556" stroke="#e3e0da" stroke-width="1.2"/>
<text x="32" y="574" font-size="15" fill="#1f2328">① 边界条件：A 反照率边界，逸出中子部分被反射回来；B 真空边界 φ = 0，用外推距离 0.71λtr 近似</text>
<text x="32" y="594" font-size="15" fill="#1f2328">② 通量分布：A 堆芯边缘通量抬高（≈0.62），功率展平；B 边缘通量趋零，中心峰突出、不均匀系数大</text>
<text x="32" y="614" font-size="15" fill="#1f2328">③ 临界尺寸：A 同样功率下临界尺寸小（反射层节省 δ）；B 临界尺寸大，泄漏多，工程上不现实</text>
<text x="948" y="651" font-size="15" fill="#6b7280" text-anchor="end">依据教材 第4章 p.61–64 自绘</text>
<rect x="24" y="96" width="452" height="456" fill="#f2f7fc" stroke="#e3e0da" stroke-width="1.2" rx="8"/>
<text x="250" y="126" font-size="20" fill="#2f6fb0" text-anchor="middle" font-weight="600">A：带反射层（芯部 a = 85 cm）</text>
<rect x="504" y="96" width="452" height="456" fill="#fbf5ef" stroke="#e3e0da" stroke-width="1.2" rx="8"/>
<text x="730" y="126" font-size="20" fill="#b0642f" text-anchor="middle" font-weight="600">B：裸堆（临界半宽 a = 115 cm）</text>
