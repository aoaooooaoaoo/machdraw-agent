<text x="514" y="493.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">②</text>
<text x="530" y="494" font-size="15" fill="#1f2328">代价：临界尺寸大、泄漏多，Ps·Pd 低</text>
<circle cx="514" cy="509" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="514" y="513.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">③</text>
<text x="530" y="514" font-size="15" fill="#1f2328">现实：世界上没有裸堆，仅作理论基准</text>
