<text x="367" y="240" font-size="15" fill="#6b7280" text-anchor="middle">反射层</text>
<text x="367" y="262" font-size="15" fill="#6b7280" text-anchor="middle">（e 指数衰减）</text>
<text x="405" y="288" font-size="15" fill="#6b7280" text-anchor="end">等效裸堆边界 a+δ</text>
