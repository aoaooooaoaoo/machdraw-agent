<text x="370" y="334" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="600">反射层节省 δ = 30 cm</text>
<circle cx="34" cy="469" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="34" y="473.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">①</text>
<text x="50" y="474" font-size="15" fill="#1f2328">边界：反照率边界，部分中子返回</text>
<circle cx="34" cy="489" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="34" y="493.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">②</text>
<text x="50" y="494" font-size="15" fill="#1f2328">效果：边缘通量抬高、功率展平，省 δ</text>
<circle cx="34" cy="509" r="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="34" y="513.6" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="600">③</text>
<text x="50" y="514" font-size="15" fill="#1f2328">材料：Σs 大、ξ 大、Σa 小（同慢化剂）</text>
