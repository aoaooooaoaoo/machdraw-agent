<g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="0" width="980" height="660" fill="#fbfaf7"/>
<text x="490" y="44" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="600">辨析 1　快群 vs 热群</text>
<text x="490" y="70" font-size="15" fill="#6b7280" text-anchor="middle">同一条压水堆能谱被分界能 0.625 eV 切成两群：快群管慢化与泄漏，热群管裂变与中毒</text>
<line x1="30" y1="82" x2="950" y2="82" stroke="#e3e0da" stroke-width="1.2"/>
<line x1="30" y1="556" x2="950" y2="556" stroke="#e3e0da" stroke-width="1.2"/>
<text x="32" y="574" font-size="15" fill="#1f2328">① 能谱位置：A 0.625 eV 以上（裂变谱+1/E 慢化谱）；B 0.625 eV 以下（Maxwell 谱+1/E 尾）</text>
<text x="32" y="594" font-size="15" fill="#1f2328">② 截面量级：A 1~5 b 量级，235U 裂变仅约 1 b；B 10²~10³ b，235U 583 b、Xe 3 Mb</text>
<text x="32" y="614" font-size="15" fill="#1f2328">③ 主要作用：A 慢化、泄漏、238U 共振吸收与快裂变；B 热裂变释放功率、氙钐中毒</text>
<text x="948" y="651" font-size="15" fill="#6b7280" text-anchor="end">依据教材 第5章 p.79–88 自绘</text>
<rect x="24" y="96" width="452" height="456" fill="#f2f7fc" stroke="#e3e0da" stroke-width="1.2" rx="8"/>
<text x="250" y="126" font-size="20" fill="#2f6fb0" text-anchor="middle" font-weight="600">A：快群（Fast group，E &gt; 0.625 eV）</text>
