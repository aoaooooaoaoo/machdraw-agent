  <g data-legend="1">
    <text x="20" y="340" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="1">① 分界线不同：A 用细点画线（对称中心线），B 用细实线波浪线，手画、不规则</text>
    <text x="20" y="360" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="2">② 适用条件不同：A 只用于对称机件；B 不受对称限制，要保留大部分外形时首选</text>
    <text x="20" y="380" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="3">③ 剖切范围不同：A 恰好剖一半；B 只剖开要表达的那一小块，其余全按外形画</text>
    <text x="20" y="400" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280" data-diff="0">注：波浪线不能与轮廓线重合、不能画在孔槽的空腔上；遇孔必须断开（B 图在孔口处断开）</text>
