  <title id="PAIR-POUMAINXIAN-FANGXIANG-t">相邻零件剖面线：同向 与 反向</title>
  <desc id="PAIR-POUMAINXIAN-FANGXIANG-d">座 + 衬套同时被剖：方向一样就成了一块料 | A：剖面线同向（错误）；B：剖面线反向（正确）</desc>
