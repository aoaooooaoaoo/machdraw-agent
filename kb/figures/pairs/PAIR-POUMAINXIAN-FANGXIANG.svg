  <g data-legend="1">
    <text x="20" y="340" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="1">① 方向不同：A 座与套的剖面线都是 45°（同向）；B 座 45°、套 135°（方向相反）</text>
    <text x="20" y="360" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="2">② 辨认结果：A 两条带连成一片，看不出是两个零件；B 一眼分开，配合面（一条线）很清楚</text>
    <text x="20" y="380" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280" data-diff="0">注：也可以方向相同而间距不同；关键是相邻零件必须能区分，同一零件在各视图中必须一致</text>
    <text x="20" y="400" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280" data-diff="0">注：相邻零件的接触面、配合面只画一条线；有间隙才画两条线</text>
