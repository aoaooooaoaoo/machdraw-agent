  <text x="570" y="307" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="#1f2937" font-weight="600">B：半剖视图</text>
  <line x1="380" y1="76" x2="380" y2="314" stroke="#d7dde6" stroke-width="1"/>
  <line x1="20" y1="318" x2="740" y2="318" stroke="#d7dde6" stroke-width="1"/>
  <g data-legend="1">
    <text x="20" y="340" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="1">① 分界不同：A 无分界（整个视图都剖开）；B 以对称中心线为界，一半剖一半视图</text>
    <text x="20" y="360" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="2">② 外形信息不同：A 完全看不到外形；B 保留一半外形，一个视图兼顾内外</text>
    <text x="20" y="380" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#1f2937" data-diff="3">③ 适用条件不同：A 用于外形简单、内形复杂（可不对称）的机件；B 只能用于对称机件</text>
    <text x="20" y="400" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280" data-diff="0">注：剖切面通过对称面、按投影关系配置时可省略标注；半剖不加标注，靠中心线识别</text>
  </g>
  </g>
