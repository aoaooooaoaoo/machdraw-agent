<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="PAIR-POU-QUAN-BAN-t PAIR-POU-QUAN-BAN-d" class="fig-svg pair-svg" data-pair-id="PAIR-POU-QUAN-BAN">
