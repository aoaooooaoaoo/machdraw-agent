<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 643 558" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG2-JIANLIANJIE-t FIG2-JIANLIANJIE-d" class="fig-svg">
  <title id="FIG2-JIANLIANJIE-t">平键连接装配剖视画法</title>
  <desc id="FIG2-JIANLIANJIE-d">轴、轮毂、键三个零件同时被剖切，剖面线方向各不相同；键两侧面是工作面（接触），键顶面与轮毂槽底留间隙。</desc>
