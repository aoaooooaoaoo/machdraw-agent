    <text x="478" y="213.62" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">顶面留间隙（夸大）</text>
    <text x="40" y="470" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 三个零件同时被剖切，剖面线方向必须两两不同（本图：轴 45°、轮毂 135°、键 45° 加密）。</text>
    <text x="40" y="492" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 键的两侧面是工作面，与轴槽、轮毂槽的侧面接触 —— 接触面只画一条线，不画间隙。</text>
    <text x="40" y="514" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 键的顶面与轮毂槽底之间留有间隙，图上必须画出这个间隙（不能贴死）。</text>
    <text x="40" y="536" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">④ 尺寸 t 是轴槽深、t₁ 是轮毂槽深，都从各自零件的表面量起；查表取标准值，不要自行凑数。</text>
