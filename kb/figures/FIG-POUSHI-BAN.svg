<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679 588" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG-POUSHI-BAN-t FIG-POUSHI-BAN-d" class="fig-svg">
  <title id="FIG-POUSHI-BAN-t">半剖视图：以对称中心线为界，一半剖一半视图</title>
  <desc id="FIG-POUSHI-BAN-d">对称零件（法兰套筒 Ø80/Ø60、内孔 Ø24）以对称中心线为分界，左半画剖视、右半画视图；视图半侧不画虚线。</desc>
  <defs>
  <pattern id="FIG-POUSHI-BAN__hatch45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-POUSHI-BAN__hatch135" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-POUSHI-BAN__hatch45d" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-POUSHI-BAN__hatch_solid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f2937" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-POUSHI-BAN__hatch_blue" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#2563eb" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#2563eb" stroke-width="1"/>
  </pattern>
  <pattern id="FIG-POUSHI-BAN__hatch_orange" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="6" height="6" fill="#ea580c" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#ea580c" stroke-width="1"/>
  </pattern>
  <marker id="FIG-POUSHI-BAN__ar-ink" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="currentColor"/></marker>
  <marker id="FIG-POUSHI-BAN__ar-blue" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#2563eb"/></marker>
  <marker id="FIG-POUSHI-BAN__ar-red" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#dc2626"/></marker>
  <marker id="FIG-POUSHI-BAN__ar-green" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#16a34a"/></marker>
  <marker id="FIG-POUSHI-BAN__ar-orange" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#ea580c"/></marker>
  <marker id="FIG-POUSHI-BAN__ar-amber" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#b45309"/></marker>
  <marker id="FIG-POUSHI-BAN__ar-violet" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#7c3aed"/></marker>
  <marker id="FIG-POUSHI-BAN__ar-teal" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#0f766e"/></marker>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="40" y="32" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">图 6  半剖视图（对称零件：法兰 Ø80、筒体 Ø60、内孔 Ø24，高 50）</text>
    <text x="40" y="52" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">半剖适用于对称零件 —— 一半表达内形、一半表达外形，一个视图兼顾两者。</text>
    <path d="M400,360 L560,360 L560,330 L540,330 L540,260 L420,260 L420,330 L400,330 Z" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="456" y1="260" x2="456" y2="360" stroke="currentColor" stroke-width="2"/>
    <rect x="420" y="260" width="36" height="70" fill="url(#FIG-POUSHI-BAN__hatch45)" stroke="none"/>
    <rect x="400" y="330" width="56" height="30" fill="url(#FIG-POUSHI-BAN__hatch45)" stroke="none"/>
    <line x1="480" y1="240" x2="480" y2="384" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="18 4 3 4"/>
    <text x="440" y="246" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor" font-weight="600">剖视（左半）</text>
    <text x="524" y="246" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor" font-weight="600">视图（右半）</text>
    <text x="480" y="400" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="#6b7280">对称中心线（分界）</text>
    <line x1="456" y1="316" x2="336" y2="296" stroke="#2563eb" stroke-width="0.8" marker-end="url(#FIG-POUSHI-BAN__ar-blue)"/>
    <text x="330" y="300" font-size="11" font-family="system-ui, sans-serif" text-anchor="end" fill="#2563eb">Ø24 孔壁：粗实线</text>
    <line x1="600" y1="260" x2="600" y2="360" stroke="currentColor" stroke-width="0.8" marker-start="url(#FIG-POUSHI-BAN__ar-ink)" marker-end="url(#FIG-POUSHI-BAN__ar-ink)"/>
    <text x="605" y="314.2" font-size="12" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">50</text>
    <line x1="543" y1="260" x2="605" y2="260" stroke="currentColor" stroke-width="0.8"/>
    <line x1="543" y1="360" x2="605" y2="360" stroke="currentColor" stroke-width="0.8"/>
    <line x1="400" y1="424" x2="560" y2="424" stroke="currentColor" stroke-width="0.8" marker-start="url(#FIG-POUSHI-BAN__ar-ink)" marker-end="url(#FIG-POUSHI-BAN__ar-ink)"/>
    <text x="480" y="438" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor">Ø80</text>
    <line x1="400" y1="363" x2="400" y2="429" stroke="currentColor" stroke-width="0.8"/>
    <line x1="560" y1="363" x2="560" y2="429" stroke="currentColor" stroke-width="0.8"/>
    <line x1="544" y1="276" x2="636" y2="266" stroke="#6b7280" stroke-width="0.8" marker-end="url(#FIG-POUSHI-BAN__ar-ink)"/>
    <text x="642" y="270" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">Ø60</text>
    <text x="40" y="470" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 半剖：以对称中心线为界，一半画剖视、一半画视图；分界线必须是对称中心线（细点画线），不能画成粗实线。</text>
    <text x="40" y="493" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 剖视侧的孔壁画粗实线、剖面线画到粗实线为止；视图侧的外形轮廓照常画。</text>
    <text x="40" y="516" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 视图半侧不画虚线 —— 内部形状已由剖视侧表达，再画虚线属重复。</text>
    <text x="40" y="539" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">④ 标注时只注剖视侧的尺寸，对称尺寸一般注到中心线（不注整圆直径）。</text>
    <text x="40" y="566" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">⑤ 若对称中心线上有轮廓线（如键槽），不能用半剖，应改用局部剖。</text>
  </g>
</svg>
