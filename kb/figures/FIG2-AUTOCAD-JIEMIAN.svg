    <text x="50" y="522" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#2563eb">命令: _line</text>
    <text x="50" y="540" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">指定第一个点:  指定下一点或 [放弃(U)]:</text>
