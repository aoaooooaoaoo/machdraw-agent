<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1075 618" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG2-AUTOCAD-JIEMIAN-t FIG2-AUTOCAD-JIEMIAN-d" class="fig-svg">
  <title id="FIG2-AUTOCAD-JIEMIAN-t">AutoCAD 界面分区与常用命令</title>
  <desc id="FIG2-AUTOCAD-JIEMIAN-d">AutoCAD 窗口分六个区：标题栏、菜单栏、功能区、绘图区、命令行、状态栏；起步只要记住 L、C、O、TR、CO 五个命令。</desc>
