    <text x="40" y="32" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">图 2-16  AutoCAD 界面分区（示意）与起步常用命令</text>
    <text x="40" y="52" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">绘图区里能看到 UCS 坐标系图标和十字光标 —— 所有命令都在命令行里回显。</text>
