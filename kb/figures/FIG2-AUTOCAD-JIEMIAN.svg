    <text x="1016" y="156" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">③ 功能区</text>
    <text x="1016" y="200" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">④ 绘图区</text>
    <text x="1016" y="520" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">⑤ 命令行</text>
    <text x="1016" y="566" font-size="10" font-family="system-ui, sans-serif" text-anchor="start" fill="#dc2626">⑥ 状态栏</text>
    <text x="40" y="596" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">起步五个命令：L = 直线（Line）/ C = 圆（Circle）/ O = 偏移（Offset）/ TR = 修剪（Trim）/ CO = 复制（Copy）。</text>
