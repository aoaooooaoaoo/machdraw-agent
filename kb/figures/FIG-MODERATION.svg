<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-MODERATION-t FIG-MODERATION-d"><title id="FIG-MODERATION-t">图 3-3  中子的慢化：平均对数能降 ξ 与平均碰撞次数</title><desc id="FIG-MODERATION-d">n = ln(E₀/E_th)/ξ：从 2 MeV 慢化到 0.0253 eV，轻水只需约 18 次碰撞，²³⁸U 却要 2000 次以上</desc><defs><marker id="FIG-MODERATION_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-MODERATION_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-MODERATION_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-MODERATION_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-MODERATION_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-MODERATION_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-MODERATION_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-MODERATION_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-MODERATION_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 3-3  中子的慢化：平均对数能降 ξ 与平均碰撞次数</text><text x="40" y="66" font-size="15" fill="#7a8288">n = ln(E₀/E_th)/ξ：从 2 MeV 慢化到 0.0253 eV，轻水只需约 18 次碰撞，²³⁸U 却要 2000 次以上</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><text x="40" y="116" font-size="16" font-weight="600" fill="#1f2328">① 从 2 MeV 慢化到 0.0253 eV 所需的平均碰撞次数</text><line x1="210" y1="372" x2="800" y2="372" stroke="#1f2328" stroke-width="1.3" marker-end="url(#FIG-MODERATION_ar_ink)"/><line x1="210" y1="372" x2="210" y2="377" stroke="#1f2328" stroke-width="1.1"/><text x="210" y="394" font-size="14" text-anchor="middle" fill="#1f2328">10¹</text><line x1="436.9" y1="372" x2="436.9" y2="377" stroke="#1f2328" stroke-width="1.1"/><text x="436.9" y="394" font-size="14" text-anchor="middle" fill="#1f2328">10²</text><line x1="436.9" y1="140" x2="436.9" y2="372" stroke="#e3e0da" stroke-width="1"/><line x1="663.8" y1="372" x2="663.8" y2="377" stroke="#1f2328" stroke-width="1.1"/><text x="663.8" y="394" font-size="14" text-anchor="middle" fill="#1f2328">10³</text><line x1="663.8" y1="140" x2="663.8" y2="372" stroke="#e3e0da" stroke-width="1"/><text x="505" y="424" font-size="15" text-anchor="middle" fill="#1f2328">平均碰撞次数 n = ln(E₀/E_th)/ξ（对数刻度）</text><rect x="210" y="147" width="58.9" height="22" rx="0" stroke="none" fill="#2f6fb0" stroke-width="0" opacity="0.72"/><text x="198" y="163" font-size="15" text-anchor="end" font-weight="600" fill="#2f6fb0">H</text><text x="276.9" y="163" font-size="14" font-weight="600" fill="#2f6fb0">18 次</text><rect x="210" y="183" width="90.6" height="22" rx="0" stroke="none" fill="#0f766e" stroke-width="0" opacity="0.72"/><text x="198" y="199" font-size="15" text-anchor="end" font-weight="600" fill="#0f766e">D</text><text x="308.6" y="199" font-size="14" font-weight="600" fill="#0f766e">25 次</text><rect x="210" y="219" width="213.2" height="22" rx="0" stroke="none" fill="#2e7d4f" stroke-width="0" opacity="0.72"/><text x="198" y="235" font-size="15" text-anchor="end" font-weight="600" fill="#2e7d4f">Be</text><text x="431.2" y="235" font-size="14" font-weight="600" fill="#2e7d4f">87 次</text><rect x="210" y="255" width="240.8" height="22" rx="0" stroke="none" fill="#b45309" stroke-width="0" opacity="0.72"/><text x="198" y="271" font-size="15" text-anchor="end" font-weight="600" fill="#b45309">C</text><text x="458.8" y="271" font-size="14" font-weight="600" fill="#b45309">115 次</text><rect x="210" y="291" width="267.9" height="22" rx="0" stroke="none" fill="#5b4b8a" stroke-width="0" opacity="0.72"/><text x="198" y="307" font-size="15" text-anchor="end" font-weight="600" fill="#5b4b8a">O</text><text x="485.9" y="307" font-size="14" font-weight="600" fill="#5b4b8a">152 次</text><rect x="210" y="327" width="530.2" height="22" rx="0" stroke="none" fill="#c0392b" stroke-width="0" opacity="0.72"/><text x="198" y="343" font-size="15" text-anchor="end" font-weight="600" fill="#c0392b">²³⁸U</text><text x="748.2" y="343" font-size="14" font-weight="600" fill="#c0392b">2172 次</text><text x="210" y="356" font-size="13" fill="#7a8288">核越轻、ξ 越大，碰撞次数越少 → 慢化越有效</text><text x="40" y="448" font-size="16" font-weight="600" fill="#1f2328">② 四种慢化剂的慢化能力与慢化比（教材 表3-1）</text><text x="48" y="472" font-size="14" font-weight="600" fill="#7a8288">慢化剂</text><text x="190" y="472" font-size="14" font-weight="600" fill="#7a8288">慢化能力 Σ_sξ / cm⁻¹</text><text x="380" y="472" font-size="14" font-weight="600" fill="#7a8288">热中子吸收截面 Σ_a / cm⁻¹</text><text x="610" y="472" font-size="14" font-weight="600" fill="#7a8288">慢化比 Σ_sξ/Σ_a</text><line x1="40" y1="480" x2="900" y2="480" stroke="#e3e0da" stroke-width="1.2"/><text x="48" y="504" font-size="15" font-weight="600" fill="#2e7d4f">重水 D₂O</text><text x="190" y="504" font-size="14" fill="#1f2328">0.55</text><text x="380" y="504" font-size="14" fill="#1f2328">4.03×10⁻⁵</text><text x="610" y="504" font-size="14" font-weight="600" fill="#1f2328">5717</text><text x="48" y="528" font-size="15" font-weight="600" fill="#b45309">石墨 C</text><text x="190" y="528" font-size="14" fill="#1f2328">0.06</text><text x="380" y="528" font-size="14" fill="#1f2328">3.0×10⁻⁴</text><text x="610" y="528" font-size="14" font-weight="600" fill="#1f2328">234</text><text x="48" y="552" font-size="15" font-weight="600" fill="#0f766e">铍 Be</text><text x="190" y="552" font-size="14" fill="#1f2328">0.21</text><text x="380" y="552" font-size="14" fill="#1f2328">1.1×10⁻³</text><text x="610" y="552" font-size="14" font-weight="600" fill="#1f2328">156</text><text x="48" y="576" font-size="15" font-weight="600" fill="#2f6fb0">轻水 H₂O</text><text x="190" y="576" font-size="14" fill="#1f2328">2.06</text><text x="380" y="576" font-size="14" fill="#1f2328">2.24×10⁻²</text><text x="610" y="576" font-size="14" font-weight="600" fill="#1f2328">92</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第3章 3.2 节 p.34~38、表3-1 p.38 与课件第3章自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">ξ = 1 + (A−1)²/(2A)·ln((A−1)/(A+1))；慢化能力 = Σ_sξ，慢化比 = Σ_sξ/Σ_a；轻水慢化能力最大但慢化比最小</text></g></svg>
