<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" role="img" aria-labelledby="FIG-XE-CHAIN-t FIG-XE-CHAIN-d"><title id="FIG-XE-CHAIN-t">图 6-1  碘-氙与钐的燃耗链</title><desc id="FIG-XE-CHAIN-d">¹³⁵I（T½=6.7 h）衰变成 ¹³⁵Xe；¹³⁵Xe 靠衰变与中子俘获两条路消失。¹⁴⁹Sm 稳定、只能靠俘获消失</desc><defs><marker id="FIG-XE-CHAIN_ar_ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#1f2328"/></marker><marker id="FIG-XE-CHAIN_ar_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2f6fb0"/></marker><marker id="FIG-XE-CHAIN_ar_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#c0392b"/></marker><marker id="FIG-XE-CHAIN_ar_aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#7a8288"/></marker><marker id="FIG-XE-CHAIN_ar_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#0f766e"/></marker><marker id="FIG-XE-CHAIN_ar_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#2e7d4f"/></marker><marker id="FIG-XE-CHAIN_ar_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#b45309"/></marker><marker id="FIG-XE-CHAIN_ar_violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#5b4b8a"/></marker><marker id="FIG-XE-CHAIN_ar_pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 Z" fill="#a04b7a"/></marker></defs><rect x="0" y="0" width="960" height="640" fill="#fbfaf7"/><g font-family="Microsoft YaHei, SimHei, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="40" y="40" font-size="24" font-weight="600" fill="#1f2328">图 6-1  碘-氙与钐的燃耗链</text><text x="40" y="66" font-size="15" fill="#7a8288">¹³⁵I（T½=6.7 h）衰变成 ¹³⁵Xe；¹³⁵Xe 靠衰变与中子俘获两条路消失。¹⁴⁹Sm 稳定、只能靠俘获消失</text><line x1="40" y1="78" x2="920" y2="78" stroke="#e3e0da" stroke-width="1"/><text x="40" y="112" font-size="16" font-weight="600" fill="#1f2328">① ¹³⁵Xe 燃耗链（热堆中毒的主角）</text><rect x="60" y="146" width="150" height="62" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.4"/><text x="135" y="172.1" font-size="15" text-anchor="middle" fill="#1f2328">²³⁵U 裂变</text><text x="135" y="192.1" font-size="15" text-anchor="middle" fill="#1f2328">γ_I = 0.064</text><line x1="210" y1="177" x2="266" y2="177" stroke="#c0392b" stroke-width="2" marker-end="url(#FIG-XE-CHAIN_ar_red)"/><rect x="266" y="146" width="168" height="62" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.4"/><text x="350" y="172.1" font-size="15" text-anchor="middle" fill="#1f2328">¹³⁵I  （T½=6.7 h）</text><text x="350" y="192.1" font-size="15" text-anchor="middle" fill="#1f2328">β⁻ 衰变，λ_I=2.9×10⁻⁵ s⁻¹</text><line x1="434" y1="177" x2="496" y2="177" stroke="#2f6fb0" stroke-width="2" marker-end="url(#FIG-XE-CHAIN_ar_blue)"/><text x="465" y="168" font-size="13" text-anchor="middle" fill="#2f6fb0">β⁻</text><rect x="496" y="146" width="190" height="62" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.4"/><text x="591" y="172.1" font-size="15" text-anchor="middle" fill="#1f2328">¹³⁵Xe  （T½=9.2 h）</text><text x="591" y="192.1" font-size="15" text-anchor="middle" fill="#1f2328">σ_a = 2.65×10⁶ b</text><line x1="686" y1="177" x2="748" y2="177" stroke="#2f6fb0" stroke-width="2" marker-end="url(#FIG-XE-CHAIN_ar_blue)"/><rect x="748" y="146" width="150" height="62" rx="8" stroke="#7a8288" fill="#f2f0ec" stroke-width="1.4"/><text x="823" y="172.1" font-size="15" text-anchor="middle" fill="#1f2328">¹³⁵Cs</text><text x="823" y="192.1" font-size="15" text-anchor="middle" fill="#1f2328">稳定（不再吸收）</text><text x="716" y="168" font-size="13" text-anchor="middle" fill="#2f6fb0">β⁻</text><line x1="135" y1="208" x2="135" y2="240" stroke="#c0392b" stroke-width="1.6" marker-end="url(#FIG-XE-CHAIN_ar_red)"/><rect x="60" y="240" width="210" height="44" rx="8" stroke="#c0392b" fill="#ffffff" stroke-width="1.4"/><text x="165" y="267.1" font-size="15" text-anchor="middle" fill="#1f2328">直接裂变产额 γ_Xe = 0.003</text><line x1="210" y1="262" x2="560" y2="262" stroke="#c0392b" stroke-width="1.6" marker-end="url(#FIG-XE-CHAIN_ar_red)"/><line x1="560" y1="262" x2="560" y2="210" stroke="#c0392b" stroke-width="1.6" marker-end="url(#FIG-XE-CHAIN_ar_red)"/><text x="300" y="254" font-size="12" fill="#c0392b">裂变直接产生（份额小）</text><line x1="591" y1="208" x2="591" y2="250" stroke="#0f766e" stroke-width="1.8" marker-end="url(#FIG-XE-CHAIN_ar_teal)"/><rect x="500" y="250" width="182" height="48" rx="8" stroke="#0f766e" fill="#e6f2ef" stroke-width="1.4"/><text x="591" y="269.1" font-size="15" text-anchor="middle" fill="#1f2328">¹³⁵Xe + n → ¹³⁶Xe</text><text x="591" y="289.1" font-size="15" text-anchor="middle" fill="#1f2328">燃耗（σXeΦ）</text><text x="700" y="254" font-size="12" fill="#0f766e">高功率时这条支路是主要的消失方式</text><text x="700" y="274" font-size="12" fill="#0f766e">（平衡浓度 ∝ 功率）</text><text x="40" y="330" font-size="16" font-weight="600" fill="#1f2328">② ¹⁴⁹Sm 燃耗链（稳定核素，只能靠俘获消失）</text><rect x="60" y="364" width="150" height="62" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.4"/><text x="135" y="390.1" font-size="15" text-anchor="middle" fill="#1f2328">²³⁵U 裂变</text><text x="135" y="410.1" font-size="15" text-anchor="middle" fill="#1f2328">γ_Pm = 0.0105</text><line x1="210" y1="395" x2="266" y2="395" stroke="#c0392b" stroke-width="2" marker-end="url(#FIG-XE-CHAIN_ar_red)"/><rect x="266" y="364" width="168" height="62" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.4"/><text x="350" y="390.1" font-size="15" text-anchor="middle" fill="#1f2328">¹⁴⁹Pm （T½=53 h）</text><text x="350" y="410.1" font-size="15" text-anchor="middle" fill="#1f2328">λ_Pm=3.6×10⁻⁶ s⁻¹</text><line x1="434" y1="395" x2="496" y2="395" stroke="#2f6fb0" stroke-width="2" marker-end="url(#FIG-XE-CHAIN_ar_blue)"/><text x="465" y="386" font-size="13" text-anchor="middle" fill="#2f6fb0">β⁻</text><rect x="496" y="364" width="190" height="62" rx="8" stroke="#c0392b" fill="#fbeae8" stroke-width="1.4"/><text x="591" y="390.1" font-size="15" text-anchor="middle" fill="#1f2328">¹⁴⁹Sm</text><text x="591" y="410.1" font-size="15" text-anchor="middle" fill="#1f2328">σ_a = 4.08×10⁴ b</text><line x1="686" y1="395" x2="748" y2="395" stroke="#0f766e" stroke-width="2" marker-end="url(#FIG-XE-CHAIN_ar_teal)"/><rect x="748" y="364" width="150" height="62" rx="8" stroke="#7a8288" fill="#f2f0ec" stroke-width="1.4"/><text x="823" y="390.1" font-size="15" text-anchor="middle" fill="#1f2328">¹⁵⁰Sm</text><text x="823" y="410.1" font-size="15" text-anchor="middle" fill="#1f2328">稳定</text><text x="716" y="386" font-size="13" text-anchor="middle" fill="#0f766e">(n,γ)</text><text x="490" y="444" font-size="13" fill="#c0392b">¹⁴⁹Sm 自身不衰变：停堆后 Pm 继续衰变成 Sm，钐毒反而增加</text><rect x="40" y="470" width="880" height="84" rx="8" stroke="#e3e0da" fill="#ffffff" stroke-width="1.2"/><text x="56" y="494" font-size="15" font-weight="600" fill="#2f6fb0"></text><text x="300" y="494" font-size="15" font-weight="600" fill="#2f6fb0">¹³⁵Xe</text><text x="590" y="494" font-size="15" font-weight="600" fill="#2f6fb0">¹⁴⁹Sm</text><text x="56" y="514" font-size="13" fill="#7a8288">消失途径</text><text x="300" y="514" font-size="13" fill="#1f2328">衰变 + 中子俘获（两条）</text><text x="590" y="514" font-size="13" fill="#1f2328">只有中子俘获（一条）</text><text x="56" y="534" font-size="13" fill="#7a8288">平衡时间</text><text x="300" y="534" font-size="13" fill="#1f2328">约 40 h（约 2 天）</text><text x="590" y="534" font-size="13" fill="#1f2328">约 1 周（慢得多）</text><text x="56" y="554" font-size="13" fill="#7a8288">平衡浓度</text><text x="300" y="554" font-size="13" fill="#1f2328">∝ 功率水平</text><text x="590" y="554" font-size="13" fill="#1f2328">与功率水平无关</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第6章 6.2.1 节 p.101~103（图6-7、图6-8）、6.2.2 节 p.107 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">γ 为裂变产额：γ_I=0.064、γ_Xe=0.003、γ_Pm=0.0105；λ_I=2.9×10⁻⁵ s⁻¹、λ_Xe=2.1×10⁻⁵ s⁻¹、σ_Xe=2.65×10⁶ b、σ_Sm=4.08×10⁴ b</text></g></svg>
