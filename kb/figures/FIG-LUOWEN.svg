<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1015 506" width="100%" height="100%" style="height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="FIG-LUOWEN-t FIG-LUOWEN-d" class="fig-svg">
  <title id="FIG-LUOWEN-t">螺纹的比例画法：外螺纹与内螺纹（剖视）对照</title>
  <desc id="FIG-LUOWEN-d">外螺纹牙顶 d 画粗实线、牙底 d₁=0.85d 画细实线，端视图牙底圆画约 3/4 圈；内螺纹剖视牙顶 D₁ 画粗实线、牙底 D 画细实线；螺纹终止线用粗实线。</desc>
  <defs>
  <pattern id="FIG-LUOWEN__hatch45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-LUOWEN__hatch135" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-LUOWEN__hatch45d" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-LUOWEN__hatch_solid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f2937" stroke-width="0.8"/>
  </pattern>
  <pattern id="FIG-LUOWEN__hatch_blue" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#2563eb" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#2563eb" stroke-width="1"/>
  </pattern>
  <pattern id="FIG-LUOWEN__hatch_orange" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="6" height="6" fill="#ea580c" fill-opacity="0.10"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#ea580c" stroke-width="1"/>
  </pattern>
  <marker id="FIG-LUOWEN__ar-ink" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="currentColor"/></marker>
  <marker id="FIG-LUOWEN__ar-blue" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#2563eb"/></marker>
  <marker id="FIG-LUOWEN__ar-red" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#dc2626"/></marker>
  <marker id="FIG-LUOWEN__ar-green" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#16a34a"/></marker>
  <marker id="FIG-LUOWEN__ar-orange" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#ea580c"/></marker>
  <marker id="FIG-LUOWEN__ar-amber" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#b45309"/></marker>
  <marker id="FIG-LUOWEN__ar-violet" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#7c3aed"/></marker>
  <marker id="FIG-LUOWEN__ar-teal" viewBox="0 0 8 8" refX="7.2" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.6,0.9 L7.2,4 L0.6,7.1 Z" fill="#0f766e"/></marker>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <text x="40" y="32" font-size="13" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor" font-weight="600">图 12  螺纹的比例画法（外螺纹 / 内螺纹剖视，M40，d₁ = 0.85d）</text>
    <text x="40" y="52" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">螺纹不按真实牙型画，只按比例画牙顶、牙底两条线 —— 这样画才能一眼区分内外螺纹。</text>
    <text x="230" y="96" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor" font-weight="600">外螺纹</text>
    <line x1="76" y1="210" x2="470" y2="210" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="18 4 3 4"/>
    <line x1="90" y1="166" x2="90" y2="254" stroke="currentColor" stroke-width="2"/>
    <line x1="90" y1="166" x2="415" y2="166" stroke="currentColor" stroke-width="2"/>
    <line x1="90" y1="254" x2="415" y2="254" stroke="currentColor" stroke-width="2"/>
    <line x1="415" y1="166" x2="430" y2="181" stroke="currentColor" stroke-width="2"/>
    <line x1="415" y1="254" x2="430" y2="239" stroke="currentColor" stroke-width="2"/>
    <line x1="430" y1="181" x2="430" y2="239" stroke="currentColor" stroke-width="2"/>
    <line x1="170" y1="172.6" x2="370" y2="172.6" stroke="currentColor" stroke-width="0.8"/>
    <line x1="170" y1="247.4" x2="370" y2="247.4" stroke="currentColor" stroke-width="0.8"/>
    <line x1="370" y1="166" x2="370" y2="254" stroke="currentColor" stroke-width="2"/>
    <line x1="44" y1="166" x2="44" y2="254" stroke="currentColor" stroke-width="0.8" marker-start="url(#FIG-LUOWEN__ar-ink)" marker-end="url(#FIG-LUOWEN__ar-ink)"/>
    <text x="39" y="214.2" font-size="12" font-family="system-ui, sans-serif" text-anchor="end" fill="currentColor">d</text>
    <line x1="87" y1="166" x2="39" y2="166" stroke="currentColor" stroke-width="0.8"/>
    <line x1="87" y1="254" x2="39" y2="254" stroke="currentColor" stroke-width="0.8"/>
    <line x1="70" y1="172.6" x2="70" y2="247.4" stroke="currentColor" stroke-width="0.8" marker-start="url(#FIG-LUOWEN__ar-ink)" marker-end="url(#FIG-LUOWEN__ar-ink)"/>
    <text x="65" y="214.2" font-size="12" font-family="system-ui, sans-serif" text-anchor="end" fill="currentColor">d₁</text>
    <line x1="87" y1="172.6" x2="65" y2="172.6" stroke="currentColor" stroke-width="0.8"/>
    <line x1="87" y1="247.4" x2="65" y2="247.4" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="560" cy="210" r="44" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M595.14,222.79 L593.72,226.17 L591.97,229.4 L589.92,232.44 L587.57,235.27 L584.96,237.85 L582.11,240.16 L579.05,242.18 L575.81,243.9 L572.41,245.28 L568.89,246.33 L565.29,247.02 L561.63,247.36 L557.96,247.34 L554.31,246.96 L550.71,246.23 L547.21,245.14 L543.83,243.72 L540.6,241.97 L537.56,239.92 L534.73,237.57 L532.15,234.96 L529.84,232.11 L527.82,229.05 L526.1,225.81 L524.72,222.41 L523.67,218.89 L522.98,215.29 L522.64,211.63 L522.66,207.96 L523.04,204.31 L523.77,200.71 L524.86,197.21 L526.28,193.83 L528.03,190.6 L530.08,187.56 L532.43,184.73 L535.04,182.15 L537.89,179.84 L540.95,177.82 L544.19,176.1 L547.59,174.72 L551.11,173.67 L554.71,172.98 L558.37,172.64 L562.04,172.66 L565.69,173.04 L569.29,173.77 L572.79,174.86" stroke="currentColor" stroke-width="0.8" fill="none"/>
    <line x1="506" y1="210" x2="614" y2="210" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="18 4 3 4"/>
    <line x1="560" y1="158" x2="560" y2="262" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="18 4 3 4"/>
    <text x="560" y="300" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor">端视图：外圈粗实线 = d，内圈细实线 ≈ 3/4 圈 = d₁</text>
    <text x="800" y="96" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle" fill="currentColor" font-weight="600">内螺纹（剖视）</text>
    <rect x="712" y="122" width="176" height="176" stroke="currentColor" stroke-width="2" fill="none"/>
    <line x1="800" y1="100" x2="800" y2="320" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="18 4 3 4"/>
    <line x1="756" y1="122" x2="756" y2="298" stroke="currentColor" stroke-width="0.8"/>
    <line x1="844" y1="122" x2="844" y2="298" stroke="currentColor" stroke-width="0.8"/>
    <line x1="762.6" y1="122" x2="762.6" y2="298" stroke="currentColor" stroke-width="2"/>
    <line x1="837.4" y1="122" x2="837.4" y2="298" stroke="currentColor" stroke-width="2"/>
    <rect x="712" y="122" width="50.6" height="176" fill="url(#FIG-LUOWEN__hatch45)" stroke="none"/>
    <rect x="837.4" y="122" width="50.6" height="176" fill="url(#FIG-LUOWEN__hatch45)" stroke="none"/>
    <line x1="368" y1="256" x2="412" y2="340" stroke="#6b7280" stroke-width="0.8" marker-end="url(#FIG-LUOWEN__ar-ink)"/>
    <text x="418" y="344" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#6b7280">螺纹终止线（粗实线）</text>
    <line x1="762.6" y1="126" x2="694" y2="116" stroke="#dc2626" stroke-width="0.8" marker-end="url(#FIG-LUOWEN__ar-red)"/>
    <text x="688" y="120" font-size="11" font-family="system-ui, sans-serif" text-anchor="end" fill="#dc2626">D₁：牙顶（粗实线）</text>
    <line x1="844" y1="126" x2="896" y2="116" stroke="#2563eb" stroke-width="0.8" marker-end="url(#FIG-LUOWEN__ar-blue)"/>
    <text x="902" y="120" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="#2563eb">D：牙底（细实线）</text>
    <text x="40" y="392" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">① 外螺纹：牙顶（大径 d）画粗实线；牙底（小径 d₁ ≈ 0.85d）画细实线；端视图中牙底圆画约 3/4 圈细实线。</text>
    <text x="40" y="415" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">② 内螺纹（剖视）：牙顶（小径 D₁）画粗实线，牙底（大径 D）画细实线；剖面线画到牙顶粗实线为止，空腔不画。</text>
    <text x="40" y="438" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">③ 螺纹终止线用粗实线：外螺纹画在螺纹段结束处、从牙顶画到牙顶；不通孔内螺纹的终止线画到牙顶。</text>
    <text x="40" y="461" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">④ 螺纹一律按比例画（d₁ ≈ 0.85d），不画真实牙型；45° 倒角在端视图上画成一个圆。</text>
    <text x="40" y="484" font-size="11" font-family="system-ui, sans-serif" text-anchor="start" fill="currentColor">⑤ 内螺纹不剖（外形视图）时：小径 D₁ 画粗实线、大径 D 画细实线（约 3/4 圈）；只有剖开后才按上面规则画实体一侧。</text>
  </g>
</svg>
