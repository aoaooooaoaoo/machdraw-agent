0">B_g² = (π/H′)²</text><circle cx="48" cy="417" r="3.5" stroke="#0f766e" fill="#0f766e" stroke-width="1"/><text x="62" y="422" font-size="13" fill="#1f2328">球形（半径 R，外推 R′ = R + d）</text><text x="62" y="438" font-size="14" font-weight="600" fill="#0f766e">B_g² = (π/R′)²</text><circle cx="48" cy="441" r="3.5" stroke="#5b4b8a" fill="#5b4b8a" stroke-width="1"/><text x="62" y="446" font-size="13" fill="#1f2328">有限高圆柱（R、H 均加外推距离）</text><text x="62" y="462" font-size="14" font-weight="600" fill="#5b4b8a">B_g² = (2.405/R′)² + (π/H′)²</text><rect x="40" y="470" width="424" height="88" rx="8" stroke="#2f6fb0" fill="#eef3f9" stroke-width="1.3"/><text x="56" y="494" font-size="15" font-weight="600" fill="#2f6fb0">临界条件：B_m² = B_g²</text><text x="56" y="518" font-size="14" fill="#1f2328">k_eff = k∞ / (1 + M²B²)（单群/修正单群）</text><text x="56" y="542" font-size="14" fill="#1f2328">B_m² = (k∞ − 1)/M²，M² = L² + τ</text><rect x="480" y="360" width="440" height="194" rx="8" stroke="#b45309" fill="#fbf4ea" stroke-width="1.3"/><text x="496" y="384" font-size="15" font-weight="600" fill="#b45309">教材例（第4章 p.59）</text><text x="496" y="408" font-size="13" fill="#7a8288">平板裸堆：k∞ = 1.06，L² = 0.03 m²，λ_tr = 0.0228 m</text><text x="496" y="427" font-size="13" fill="#1f2328"></text><text x="496" y="446" font-size="13" fill="#1f2328">B_m² = (k∞−1)/L² = 0.06/0.03 = 2.0 m⁻²</text><text x="496" y="465" font-size="13" fill="#1f2328">B_g = π/H′ → H′ = π/1.414 = 2.221 m</text><text x="496" y="484" font-size="13" fill="#1f2328">d = 0.7104λ_tr = 0.0162 m</text><text x="496" y="503" font-size="13" fill="#1f2328">H = H′ − 2d = 2.221 − 0.032 = 2.189 m ≈ 2.19 m</text><text x="496" y="522" font-size="13" fill="#1f2328"></text><text x="496" y="541" font-size="13" fill="#1f2328">若取 H = 2.5 m，则 B_g² = 1.524 m⁻²，</text><text x="496" y="560" font-size="13" fill="#1f2328">k_eff = 1.06/(1 + 0.03×1.524) = 1.013，ρ ≈ 1.3%</text><line x1="40" y1="578" x2="920" y2="578" stroke="#e3e0da" stroke-width="1"/><text x="40" y="600" font-size="14" fill="#7a8288">依据教材 第4章 4.2.1 节 p.56~60、4.3 节 p.65 自绘</text><text x="40" y="620" font-size="14" fill="#7a8288">例（教材第4章 p.59）：k∞=1.06、L²=0.03 m²、λ_tr=0.0228 m 的平板裸堆，临界厚度 H=2.190 m</text></g></svg>
