# Render 蓝图：把本仓库一键部署成公网可访问的免费 Web 服务
#
# 用法：Render → New → Blueprint → 选中本仓库 → Apply
# 免费档说明：
#   · 15 分钟无访问会休眠，下一次访问需要 ~40 秒唤醒（首屏会显示 loading）
#   · 512 MB 内存：本项目运行时约 250–300 MB，够用
#   · 每月 750 小时免费额度，单个服务足够
services:
  - type: web
    name: machdraw-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # 首次构建约 5–8 分钟（要装 node 依赖 + Python 依赖 + 建索引）
    envVars:
      # 默认走本地抽取模式，不需要任何 API Key 就能跑
      - key: MW_LLM_PROVIDER
        value: mock
      # 想接真实模型时在 Render 控制台改成 deepseek 并填 Key
      # - key: MW_LLM_PROVIDER
      #   value: deepseek
      # - key: MW_LLM_API_KEY
      #   sync: false
      - key: PYTHONIOENCODING
        value: utf-8
