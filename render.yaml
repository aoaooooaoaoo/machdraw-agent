# Render 蓝图：把本仓库一键部署成公网可访问的免费 Web 服务
#
# 用法：Render → New → Blueprint → 选中本仓库 → Apply
# 免费档说明：
#   · 15 分钟无访问会休眠，下一次访问需要约 40 秒唤醒（首屏会显示 loading）
#   · 512 MB 内存：本项目运行时约 250–300 MB，够用
#   · 每月 750 小时免费额度，单个服务足够
services:
  - type: web
    name: reactor-physics-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # 首次构建约 5–8 分钟（要装 node 依赖 + Python 依赖 + 建索引）
    envVars:
      # ---- 大模型：讯飞星辰 MaaS 免费模型 spark-x2.6-4b（¥0/百万 tokens）
      # 没有 Key 时后端自动回落到 mock，仍可完整演示：
      - key: RP_LLM_PROVIDER
        value: openai-compatible
      - key: RP_LLM_BASE_URL
        value: https://maas-api.cn-huabei-1.xf-yun.com/v2
      - key: RP_LLM_MODEL
        value: spark-x2.6-4b
      # 关掉思维链（星火默认 115s/3405 推理 token；关掉后 ~6s/0 推理 token）
      - key: RP_LLM_EXTRA_BODY
        value: '{"thinking":{"type":"disabled"}}'
      # API Key 不进仓库，部署时在 Render 控制台填：
      # 服务 → Environment → RP_LLM_API_KEY = sk-xxxx
      - key: RP_LLM_API_KEY
        sync: false
      - key: PYTHONIOENCODING
        value: utf-8
